            let volInput = document.getElementById('pengeluaran_volume');
            let kategoriHidden = document.getElementById('pengeluaran_kategori');
            let guruHidden = document.getElementById('pengeluaran_nama_guru');
            let rencanaHidden = document.getElementById('pengeluaran_rencana_id');
            let sumberSelect = document.getElementById('pengeluaran_sumber_dana');
            
            // Auto-fill nilai
            if (nilaiInput) {
                nilaiInput.setAttribute('data-estimasi', nilai);
                nilaiInput.value = nilai ? nilai.toLocaleString('id-ID') : '';
            }
            
            // Set max volume dari sisa
            if (volInput) { 
                volInput.setAttribute('max', sisa); 
                if (!isEditMode) volInput.value = sisa; 
            }
            
            // Set hidden metadata
            if (kategoriHidden) kategoriHidden.value = kategori;
            if (guruHidden) guruHidden.value = namaGuru;
            if (rencanaHidden) rencanaHidden.value = rencanaId;
            
            // Tampilkan kategori di kotak info bawah uraian
            if (kategoriDisplay) {
                if (kategori) {
                    kategoriDisplay.innerHTML = `<span style="background: #dbeafe; color: #1e40af; padding: 3px 10px; border-radius: 6px; font-size: 12px;">${kategori}</span>`;
                } else {
                    kategoriDisplay.innerHTML = '<span style="color: var(--muted); font-weight: normal; font-size: 12px;">(Tanpa Kategori)</span>';
                }
            }
            
            // Tampilkan info sisa volume
            if (sisaDisplay) {
                sisaDisplay.innerHTML = `Volume rencana: <b>${volumeRencana}</b> • Sisa tersedia: <b style="color: ${sisa > 0 ? 'var(--success)' : 'var(--danger)'};">${sisa}</b>`;
            }
            
            // Auto-select sumber dana dari sumber_dana_map guru (jika dari guru)
                        // Auto-select sumber dana:
            // 1. Prioritas: sumber_dana dari RAB admin itu sendiri
            // 2. Fallback: sumber_dana_map guru (jika RAB berasal dari guru)
            if (sumberSelect) {
                let sumberFromRAB = opt.getAttribute('data-sumber') || '';
                let defaultSumber = '';
                
                if (sumberFromRAB) {
                    defaultSumber = sumberFromRAB;
                } else if (kategori && namaGuru) {
                    let statusObj = (db["Status Anggaran Guru"] || []).find(x => x.guru === namaGuru && x.tahun === tahunAnggaran);
                    let map = statusObj?.sumber_dana_map || {};
                    defaultSumber = map[kategori] || '';
                }
                
                if (defaultSumber) {
                    // Cek apakah option dengan value tsb ada
                    let optExists = Array.from(sumberSelect.options).some(o => o.value === defaultSumber);
                    if (optExists) {
                        sumberSelect.value = defaultSumber;
                        // Trigger validasi saldo setelah auto-select
                        setTimeout(() => validateSaldoSumberDana(), 10);
                    }
                }
            }
            
            calcPengeluaranTotal();
        }

        function validateSaldoSumberDana() {
            let sel = document.getElementById('pengeluaran_sumber_dana');
            let info = document.getElementById('info_saldo');
            let totalInput = document.getElementById('pengeluaran_total');
            if (!sel || !info) return;
            if (!sel.value) { info.style.color = 'var(--muted)'; info.innerHTML = 'Pilih sumber dana.'; return; }
            let saldo = Number(sel.options[sel.selectedIndex].getAttribute('data-saldo') || 0);
            let total = Number((totalInput?.value || '').replace(/\./g, '')) || 0;
            if (total > saldo) {
                info.style.color = 'var(--danger)';
                info.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Total (${rupiah(total)}) melebihi saldo <b>${sel.value}</b> (${rupiah(saldo)})!`;
            } else {
                info.style.color = 'var(--success)';
                info.innerHTML = `<i class="fa-solid fa-check-circle"></i> Saldo cukup. Sisa: <b>${rupiah(saldo - total)}</b>`;
            }
        }

        /* =====================================================
           FORM DINAMIS
        ===================================================== */
        function openForm(name, id=null){
            let item = id ? db[name].find(x => x.id === id) : null;
            document.getElementById("modal").classList.add("show");
            document.getElementById("modalTitle").innerText = id ? `Edit ${name}` : `Tambah ${name}`;
            let fields = getDefaultFields(name);

            document.getElementById("dataForm").innerHTML=`
                <div class="form-grid">
                ${fields.map(field=>{
                    let value = item?.[field]??""; let inputHtml = "", isFull = false;
                    if (field === "kode" || field === "nomor") {
                        let seq = id ? value : ("GIM-" + Date.now().toString().slice(-4));
                        inputHtml = `<input type="text" name="${field}" value="${seq}" readonly style="background:#eef2f6; font-weight:bold;">`;
                    }
                    else if (field === "tanggal") { inputHtml = `<input type="date" name="${field}" value="${value}" required>`; }
                    else if (field === "kategori" && name === "Pendapatan") {
                        let kats = getKategoriPendapatanList();
                        let opts = kats.map(k => `<option value="${k.nama}" ${value === k.nama ? "selected" : ""}>${k.nama}</option>`).join("");
                        inputHtml = `<select name="${field}" required><option value="">-- Pilih Kategori --</option>${opts}</select>`;
                    }
                    else if (field === "keterangan") { isFull = true; inputHtml = `<textarea name="${field}" required>${value}</textarea>`; }
                    else if (field === "jumlah") {
                        let fv = value ? Number(value).toLocaleString('id-ID') : "";
                        inputHtml = `<input type="text" name="${field}" value="${fv}" oninput="formatRupiahInput(this)" required>`;
                    }
                    else if (field === "status") {
                        inputHtml = `<select name="${field}" required><option value="Tunai" ${value === "Tunai" ? "selected" : ""}>Tunai</option><option value="Transfer" ${value === "Transfer" ? "selected" : ""}>Transfer</option></select>`;
                    }
                    else if (field === "kategori_belanja" && name === "Rencana Anggaran") {
                        let kats = getKategoriBelanjaList();
                        let opts = kats.map(k => `<option value="${k.nama}" ${value === k.nama ? "selected" : ""}>${k.nama}</option>`).join("");
                        inputHtml = `<select name="${field}" required>
                                        <option value="">-- Pilih Kategori Belanja --</option>
                                        ${opts}
                                     </select>
                                     <small style="color:var(--muted); font-size:11px;">
                                        Kategori tidak ada? <a href="javascript:void(0)" onclick="closeModal(); openKategoriBelanjaModal();" style="color: var(--primary2); font-weight: bold;">Kelola Kategori</a>
                                     </small>`;
                    }
                    else if (field === "uraian" && name === "Rencana Anggaran") { inputHtml = `<input type="text" name="${field}" value="${value}" required>`; }
                    else if (field === "volume" && name === "Rencana Anggaran") { let fv = value ? Number(value).toLocaleString('id-ID') : ""; inputHtml = `<input type="text" id="anggaran_volume" name="${field}" value="${fv}" oninput="formatRupiahInput(this); calcAnggaranTotal()" required>`; }
                    else if (field === "nilai" && name === "Rencana Anggaran") { let fv = value ? Number(value).toLocaleString('id-ID') : ""; inputHtml = `<input type="text" id="anggaran_nilai" name="${field}" value="${fv}" oninput="formatRupiahInput(this); calcAnggaranTotal()" required>`; }
                    else if (field === "total" && name === "Rencana Anggaran") { let fv = value ? Number(value).toLocaleString('id-ID') : ""; inputHtml = `<input type="text" id="calc_total" name="${field}" value="${fv}" readonly style="background:#eef2f6">`; }
                    else if (field === "sumber_dana" && name === "Rencana Anggaran") {
                        let kats = getKategoriPendapatanList();
                        let opts = kats.map(k => `<option value="${k.nama}" ${value === k.nama ? "selected" : ""}>${k.nama}</option>`).join("");
                        inputHtml = `<select name="${field}" required><option value="">-- Pilih Sumber Dana --</option>${opts}</select>`;
                    }
                    else if (field === "uraian" && name === "Rencana Pengeluaran") {
                        let allAnggaran = getView("Rencana Anggaran").filter(a => !a.nama_guru);
                        let allPengeluaran = getView("Rencana Pengeluaran");
                        let opts = `<option value="" data-kategori="" data-sisa="0">-- Pilih Uraian --</option>`;
                        allAnggaran.forEach(a => {
                            let terpakai = allPengeluaran.filter(p => p.rencana_id === a.id).filter(p => p.id !== id).reduce((acc, curr) => acc + (Number(curr.volume) || 0), 0);
                            let sisaVol = (Number(a.volume) || 0) - terpakai;
                            let isSelected = item && (item.rencana_id === a.id);
                            if (sisaVol > 0 || isSelected) {
                                opts += `<option value="${a.uraian}" 
                                                    data-rencana-id="${a.id}" 
                                                    data-nama-guru="${a.nama_guru || ''}" 
                                                    data-kategori="${a.kategori_belanja || ''}" 
                                                    data-nilai="${a.nilai || 0}" 
                                                    data-sisa="${sisaVol}" 
                                                    data-tahun="${a.tahun || ''}"
                                                    data-volume-rencana="${a.volume || 0}"
                                                    data-sumber="${a.sumber_dana || ''}"
                                                    ${isSelected ? "selected" : ""}>${a.uraian}</option>`;
                            }
                        });
                        
                        // Set nilai kategori awal (kalau edit)
                        let initKategori = item?.kategori_belanja || "";
                        
                        inputHtml = `
                            <select name="${field}" id="pengeluaran_uraian" onchange="autoFillPengeluaranAdmin()" required>${opts}</select>
                            
                            <input type="hidden" name="rencana_id" id="pengeluaran_rencana_id" value="${item?.rencana_id || ''}">
                            <input type="hidden" name="nama_guru" id="pengeluaran_nama_guru" value="${item?.nama_guru || ''}">
                            <input type="hidden" name="kategori_belanja" id="pengeluaran_kategori" value="${initKategori}">
                            
                            <div style="margin-top: 8px; padding: 10px 12px; background: #eff6ff; border-left: 3px solid #3b82f6; border-radius: 6px;">
                                <div style="font-size: 11px; color: #1e40af; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">
                                    <i class="fa-solid fa-tag"></i> Kategori Belanja
                                </div>
                                <div id="pengeluaran_kategori_display" style="font-size: 14px; font-weight: bold; color: var(--primary);">
                                    ${initKategori || '<span style="color: var(--muted); font-weight: normal; font-size: 12px;">— Pilih uraian untuk melihat kategori —</span>'}
                                </div>
                                <div id="pengeluaran_sisa_display" style="font-size: 11px; color: var(--muted); margin-top: 4px;"></div>
                            </div>
                        `;
                    }
                    else if (field === "volume" && name === "Rencana Pengeluaran") { inputHtml = `<input type="number" id="pengeluaran_volume" name="${field}" value="${value}" oninput="calcPengeluaranTotal()" min="1" required>`; }
                    else if (field === "nilai" && name === "Rencana Pengeluaran") { 
                        let fv = value ? Number(value).toLocaleString('id-ID') : ""; 
                        inputHtml = `<input type="text" id="pengeluaran_nilai" name="${field}" value="${fv}" oninput="formatRupiahInput(this); calcPengeluaranTotal()" required>
                                     <small id="info_nilai" style="font-size:11px; color:var(--muted);">Masukkan harga satuan aktual (tidak boleh melebihi estimasi)</small>`; 
                    }
                    else if (field === "total" && name === "Rencana Pengeluaran") { let fv = value ? Number(value).toLocaleString('id-ID') : ""; inputHtml = `<input type="text" id="pengeluaran_total" name="${field}" value="${fv}" readonly style="background:#eef2f6; font-weight:bold;">`; }
                    else if (field === "sumber_dana" && name === "Rencana Pengeluaran") {
                        let saldoMap = hitungSaldoKategoriDanaLokal(id);
                        if (id) { let old = db[name].find(x => x.id === id); if (old && old.sumber_dana && saldoMap[old.sumber_dana] !== undefined) saldoMap[old.sumber_dana] += Number(old.total) || 0; }
                        let opts = `<option value="">-- Pilih Sumber Dana --</option>`;
                        Object.keys(saldoMap).sort().forEach(k => {
                            let saldo = saldoMap[k];
                            opts += `<option value="${k}" data-saldo="${saldo}" ${value === k ? 'selected' : ''}>${k} — Saldo: ${rupiah(saldo)}${saldo <= 0 ? ' [KOSONG]' : ''}</option>`;
                        });
                        inputHtml = `<select name="${field}" id="pengeluaran_sumber_dana" required onchange="validateSaldoSumberDana()">${opts}</select><small id="info_saldo" style="font-size:11px; margin-top:4px; display:block; color:var(--muted);">Pilih sumber dana.</small>`;
                    }
                    else { inputHtml = `<input type="text" name="${field}" value="${value}" required>`; }
                    return `<div class="form-group ${isFull ? 'full' : ''}"><label style="text-transform:capitalize">${field.replace("_", " ")}</label>${inputHtml}</div>`;
                }).join("")}
                ${name === "Rencana Pengeluaran" ? `
                    <div class="form-group full">
                        <label>Bukti Bayar (Foto/PDF) — Opsional</label>
                        <input type="file" id="bukti_file" accept="image/*,application/pdf" onchange="handleBuktiUpload(this)" style="padding: 8px; border: 1px dashed #cbd5e1; border-radius: 8px; background: #f8fafc;">
                        <div id="bukti_preview" style="margin-top:10px;"></div>
                        <small style="color:var(--muted); font-size:11px;">Maksimal 3MB. Gambar akan dikompres otomatis.</small>
                    </div>` : ''}
                </div><br>
                <button type="button" class="btn btn-success" onclick="saveForm('${name}', ${id || "null"})"><i class="fa-solid fa-save"></i> Simpan</button>
                <button type="button" class="btn btn-light" onclick="closeModal()">Batal</button>`;

            if (name === "Rencana Pengeluaran") {
                setTimeout(() => { 
                    if (item && item.uraian) autoFillPengeluaranAdmin(true);
                    validateSaldoSumberDana();
                    if (item && item.bukti_bayar) {
                        tempBuktiBayar = { data: item.bukti_bayar, nama: item.bukti_bayar_nama || "bukti" };
                        let type = item.bukti_bayar.startsWith("data:application/pdf") ? "pdf" : "image";
                        renderBuktiPreview(item.bukti_bayar, item.bukti_bayar_nama || "bukti", type);
                    } else {
                        tempBuktiBayar = { data: "", nama: "" };
                    }
                }, 50);
            } else {
                tempBuktiBayar = { data: "", nama: "" };
            }
        }

        function getDefaultFields(name){
            const map = { 
                "Pendapatan": ["tanggal", "kategori", "keterangan", "jumlah", "status"],
                "Rencana Anggaran": ["kode", "kategori_belanja", "uraian", "volume", "nilai", "total", "sumber_dana"], 
                "Rencana Pengeluaran": ["nomor", "tanggal", "uraian", "volume", "nilai", "total", "sumber_dana", "status"]
            };
            return map[name] || [];
        }

        /* =====================================================
           SIMPAN & HAPUS — AUTO INJECT TAHUN AKTIF
        ===================================================== */
        function saveForm(name, id){
            if (!checkTahunAktif()) return;
            
            const form = document.getElementById("dataForm");
            if(!form.checkValidity()) { toast("Lengkapi semua kolom!"); return; }
            const fd = new FormData(form); 
            let obj = {};
            fd.forEach((value, key) => { 
                if (key === "volume" || key === "nilai" || key === "total" || key === "jumlah") obj[key] = Number(value.replace(/\./g, '')); 
                else if (key === "rencana_id") obj[key] = value ? Number(value) : null;
                else obj[key] = value;
            });

            if (name === "Rencana Anggaran") {
                if (!obj.kategori_belanja || !obj.kategori_belanja.trim()) {
                    toast("Pilih/isi kategori belanja terlebih dahulu!");
                    return;
                }
                obj.kategori_belanja = obj.kategori_belanja.trim();
            }

            if (name === "Rencana Pengeluaran") {
                if (!obj.uraian || !obj.rencana_id) { toast("Pilih uraian!"); return; }
                if (!obj.sumber_dana) { toast("Pilih sumber dana!"); return; }
                if (!obj.total || obj.total <= 0) { toast("Total harus > 0!"); return; }
                let rencana = (db["Rencana Anggaran"] || []).find(x => x.id === obj.rencana_id);
                if (!rencana) { toast("Rencana tidak ditemukan!"); return; }
                let estimasiNilai = Number(rencana.nilai) || 0;
                if (estimasiNilai > 0 && obj.nilai > estimasiNilai) {
                    Swal.fire({ title: 'Harga Melebihi Estimasi!', html: `Estimasi: <b>${rupiah(estimasiNilai)}</b><br>Harga aktual: <b style="color:var(--danger);">${rupiah(obj.nilai)}</b>`, icon: 'error' });
                    return;
                }
                let terpakai = (db["Rencana Pengeluaran"] || []).filter(p => p.rencana_id === obj.rencana_id && p.id !== id).reduce((s, x) => s + (Number(x.volume) || 0), 0);
                let sisaVol = (Number(rencana.volume) || 0) - terpakai;
                if (obj.volume > sisaVol) { Swal.fire('Volume Melebihi!', `Sisa: ${sisaVol}.`, 'error'); return; }
                let saldoMap = hitungSaldoKategoriDanaLokal(id);
                if (id) { let old = db[name].find(x => x.id === id); if (old && old.sumber_dana && saldoMap[old.sumber_dana] !== undefined) saldoMap[old.sumber_dana] += Number(old.total) || 0; }
                if (obj.total > (saldoMap[obj.sumber_dana] || 0)) { Swal.fire('Saldo Tidak Cukup!', `Saldo <b>${obj.sumber_dana}</b>: ${rupiah(saldoMap[obj.sumber_dana] || 0)}`, 'error'); return; }
                if (tempBuktiBayar.data) {
                    obj.bukti_bayar = tempBuktiBayar.data;
                    obj.bukti_bayar_nama = tempBuktiBayar.nama;
                } else if (id) {
                    let old = db[name].find(x => x.id === id);
                    if (old && old.bukti_bayar) { obj.bukti_bayar = old.bukti_bayar; obj.bukti_bayar_nama = old.bukti_bayar_nama; }
                }
                obj.approval_status = "Disetujui";
                obj._from_guru = false;
                if (!obj.status) obj.status = "Tunai";
                if (!obj.nomor) obj.nomor = "GIM-" + Date.now().toString().slice(-4);
            }

            if (["Pendapatan", "Rencana Anggaran", "Rencana Pengeluaran"].includes(name)) {
                obj.tahun = TAHUN_AKTIF;
            }
            // Pendapatan tidak perlu approval — langsung Disetujui
            if (name === "Pendapatan") {
                obj.approval_status = "Disetujui";
            }

            if(id){ 
                const index = db[name].findIndex(x => x.id === id); obj.id = id; db[name][index] = obj; toast("Data diperbarui"); 
            } else { 
                obj.id = Date.now(); if(!db[name]) db[name] = []; db[name].push(obj); toast("Data ditambahkan"); 
            }
            saveDB(); closeModal(); openTable(name);
        }

        function deleteData(name, id){
            Swal.fire({
                title: `Hapus Data ${name}?`, text: "Data akan dihapus permanen",
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'Ya, Hapus', cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    db[name] = db[name].filter(x => x.id !== id);
                    saveDB(); openTable(name); 
                    Swal.fire({ title: 'Terhapus!', icon: 'success', timer: 1200, showConfirmButton: false });
                }
            });
        }

        /* =====================================================
           INIT — dibungkus IIFE supaya tidak ada top-level return
        ===================================================== */
        (function initAnggaranPage() {
            const target = sessionStorage.getItem("targetMenu");

            if (!TAHUN_AKTIF) {
                document.getElementById("app").innerHTML = `
                <div class="page-header">
                    <div><h1>Tahun Anggaran Belum Aktif</h1><p>Sistem membutuhkan tahun anggaran aktif untuk menampilkan data</p></div>
                    <button class="btn btn-primary" onclick="goToMasterTahun()"><i class="fa-solid fa-gear"></i> Buka Master Data</button>
                </div>
                <div class="box" style="text-align:center; padding: 50px;">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 64px; color: var(--warning); display: block; margin-bottom: 20px;"></i>
                    <h2 style="color: var(--primary); margin-bottom: 12px;">Tidak Ada Tahun Anggaran Aktif</h2>
                    <p style="color: var(--muted); max-width: 500px; margin: 0 auto 20px;">
                        Silakan aktifkan salah satu tahun anggaran di menu <b>Master Data → Tahun Anggaran</b> terlebih dahulu.<br>
                        Setelah diaktifkan, semua data anggaran (admin & guru) akan otomatis menampilkan tahun tersebut.
                    </p>
                    <button class="btn btn-primary" onclick="goToMasterTahun()">
                        <i class="fa-solid fa-arrow-right"></i> Buka Pengaturan Tahun Anggaran
                    </button>
                </div>`;
                sessionStorage.removeItem("targetMenu");
                return;
            }

            if (target === "Rencana Pengeluaran") { openTable(target); document.getElementById('budgetMenu')?.classList.add('open'); }
            else if (target === "Realisasi") { openBudget(); document.getElementById('budgetMenu')?.classList.add('open'); }
            else if (target === "Rencana Anggaran") { openTable("Rencana Anggaran"); document.getElementById('budgetMenu')?.classList.add('open'); }
            else if (target === "Anggaran Kebutuhan Guru") { openTable("Anggaran Kebutuhan Guru"); document.getElementById('budgetMenu')?.classList.add('open'); }
            else { openTable("Pendapatan"); document.getElementById('budgetMenu')?.classList.add('open'); }
            sessionStorage.removeItem("targetMenu"); 
        })();

        // Helper navigasi ke master.html → Tahun Anggaran
        function goToMasterTahun() {
            sessionStorage.setItem("targetMenu", "Tahun Anggaran");
            window.location.href = "master.html";
        }
    </script>
</body>
</html>
