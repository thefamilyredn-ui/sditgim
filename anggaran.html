<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anggaran - SIMKU SD GIM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h3 id="topTitle">Anggaran</h3>
            </div>
            <div class="user-box">
                <div class="user-text">
                    <strong id="userDisplayName">User</strong><br>
                    <small id="userDisplayRole">Admin</small>
                </div>
            </div>
        </header>
        <section class="content" id="app"></section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Data</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="dataForm"></form>
        </div>
    </div>

    <div class="modal" id="modalKategori">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <div>
                    <h3>Kelola Kategori Pendapatan</h3>
                    <p style="font-size:12px; color:var(--muted); margin-top:5px;">Tambahkan kategori baru atau ubah nama kategori existing</p>
                </div>
                <span class="close" onclick="closeKategoriModal()">&times;</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="newKategoriName" placeholder="Nama kategori baru..." style="flex: 1; padding: 11px; border: 1px solid #dce3ea; border-radius: 8px;" onkeypress="if(event.key==='Enter'){event.preventDefault(); tambahKategoriPendapatan();}">
                <button class="btn btn-primary" onclick="tambahKategoriPendapatan()"><i class="fa-solid fa-plus"></i> Tambah</button>
            </div>
            <div id="kategoriListContainer" style="max-height: 380px; overflow-y: auto;"></div>
        </div>
    </div>

        <!-- Modal Kelola Kategori Belanja -->
    <div class="modal" id="modalKategoriBelanja">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <div>
                    <h3>Kelola Kategori Belanja</h3>
                    <p style="font-size:12px; color:var(--muted); margin-top:5px;">Kategori yang ditambahkan akan otomatis muncul di form Rencana Anggaran</p>
                </div>
                <span class="close" onclick="closeKategoriBelanjaModal()">&times;</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="newKategoriBelanjaName" placeholder="Nama kategori belanja baru..." style="flex: 1; padding: 11px; border: 1px solid #dce3ea; border-radius: 8px;" onkeypress="if(event.key==='Enter'){event.preventDefault(); tambahKategoriBelanja();}">
                <button class="btn btn-primary" onclick="tambahKategoriBelanja()"><i class="fa-solid fa-plus"></i> Tambah</button>
            </div>
            <div id="kategoriBelanjaListContainer" style="max-height: 380px; overflow-y: auto;"></div>
        </div>
    </div>

        <!-- Modal Detail Kategori Pengeluaran -->
    <div class="modal" id="modalDetailKategoriPengeluaran">
        <div class="modal-content" style="max-width: 1050px; padding: 0;">
            <div style="background: linear-gradient(135deg, #dc3545, #a02c39); color: white; padding: 20px 25px; border-radius: 14px 14px 0 0;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:15px;">
                    <div>
                        <h3 id="detailKatPengTitle" style="margin: 0; font-size: 17px;">Detail Kategori</h3>
                        <p id="detailKatPengSubtitle" style="font-size: 12px; opacity: 0.95; margin-top: 6px; line-height: 1.5;"></p>
                    </div>
                    <span class="close" onclick="closeDetailKategoriPengeluaran()" style="color: white; font-size: 24px; opacity: 0.8;">&times;</span>
                </div>
            </div>
            <div id="detailKatPengContent" style="padding: 25px;"></div>
        </div>
    </div>

    <div class="modal" id="modalDetailRab">
        <div class="modal-content" style="max-width: 900px;">
            <div class="rab-detail-header">
                <div>
                    <h3 style="margin:0; font-size:17px;" id="detailRabTitle">RAB Guru</h3>
                    <p style="font-size:12px; opacity:0.85; margin-top:4px;" id="detailRabSubtitle"></p>
                </div>
                <span class="close" onclick="closeDetailRab()" style="color:white; font-size:24px;">&times;</span>
            </div>
            <div id="detailRabSummary"></div>
            <div id="detailRabContent"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="db.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const targetMenu = sessionStorage.getItem("targetMenu") || 'Pendapatan';
        renderSidebar(targetMenu);
        const user = checkAuth("admin"); 
        document.getElementById("userDisplayName").innerText = user.nama;

        /* =====================================================
           YEAR FILTER — LOGIKA UTAMA TAHUN ANGGARAN TUNGGAL
        ===================================================== */
        const TAHUN_AKTIF = (db["Tahun Anggaran"] || []).find(x => x.status === "Aktif")?.tahun || null;

        function getItemYear(item) {
            if (!item) return "";
            if (item.tahun) return String(item.tahun);
            if (item.tanggal) return String(item.tanggal).substring(0, 4);
            return "";
        }

        function filterYear(arr) {
            if (!Array.isArray(arr)) return [];
            if (!TAHUN_AKTIF) return [];
            return arr.filter(x => getItemYear(x) === TAHUN_AKTIF);
        }

        function getView(collection) {
            let arr = db[collection] || [];
            if (collection === "Kategori Pendapatan" || collection === "Pengguna" || collection === "Hak Akses" || collection === "Tahun Anggaran") {
                return arr;
            }
            return filterYear(arr);
        }

        function checkTahunAktif() {
            if (!TAHUN_AKTIF) {
                Swal.fire({
                    title: 'Tidak Ada Tahun Aktif',
                    html: `Silakan aktifkan salah satu tahun anggaran di menu <b>Master Data → Tahun Anggaran</b> terlebih dahulu sebelum mengelola data anggaran.`,
                    icon: 'warning',
                    confirmButtonText: 'Mengerti',
                    confirmButtonColor: '#1d5d9b'
                });
                return false;
            }
            return true;
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('show')) sidebar.classList.remove('show');
        }
        function closeModal() { document.getElementById("modal").classList.remove("show"); }

        /* ============== STATE BUKTI BAYAR ============== */
        let tempBuktiBayar = { data: "", nama: "" };

        function handleBuktiUpload(input) {
            if (!input.files || !input.files[0]) return;
            let file = input.files[0];
            if (file.size > 3 * 1024 * 1024) { toast("Ukuran file maksimal 3MB!"); input.value = ""; return; }
            let reader = new FileReader();
            reader.onload = function(e) {
                let dataUrl = e.target.result;
                if (file.type.startsWith("image/")) {
                    compressImage(dataUrl, 900, 0.7, function(compressed) {
                        tempBuktiBayar = { data: compressed, nama: file.name };
                        renderBuktiPreview(compressed, file.name, "image");
                    });
                } else {
                    tempBuktiBayar = { data: dataUrl, nama: file.name };
                    renderBuktiPreview(dataUrl, file.name, "pdf");
                }
            };
            reader.readAsDataURL(file);
        }

        function compressImage(dataUrl, maxWidth, quality, callback) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement("canvas");
                let ratio = img.width > maxWidth ? maxWidth / img.width : 1;
                canvas.width = img.width * ratio;
                canvas.height = img.height * ratio;
                let ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL("image/jpeg", quality));
            };
            img.src = dataUrl;
        }

        function renderBuktiPreview(dataUrl, nama, type) {
            let preview = document.getElementById("bukti_preview");
            if (!preview) return;
            let thumbHtml = type === "image"
                ? `<img src="${dataUrl}" style="max-width:120px; max-height:120px; border:1px solid #dce3ea; border-radius:8px; padding:3px; background:white; object-fit:cover;">`
                : `<div style="padding:16px 22px; background:#fef2f2; border-radius:8px; border:1px solid #fecaca; display:inline-block; text-align:center;">
                    <i class="fa-solid fa-file-pdf" style="font-size:28px; color:#dc3545;"></i>
                    <div style="font-size:11px; color:var(--muted); margin-top:4px;">PDF</div>
                   </div>`;
            preview.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    ${thumbHtml}
                    <div>
                        <div style="font-size:12px; color:var(--text); margin-bottom:6px; font-weight:bold; word-break:break-all;">${nama}</div>
                        <button type="button" class="btn btn-light btn-sm" onclick="hapusBukti()" style="background:#fff5f5; border:1px solid #ffcccc; color:#dc3545;">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                    </div>
                </div>`;
        }

        function hapusBukti() {
            tempBuktiBayar = { data: "", nama: "" };
            let fi = document.getElementById("bukti_file"); if (fi) fi.value = "";
            let preview = document.getElementById("bukti_preview"); if (preview) preview.innerHTML = "";
        }

        function lihatBukti(id) {
            let item = (db["Rencana Pengeluaran"] || []).find(x => x.id === id);
            if (!item || !item.bukti_bayar) { toast("Bukti tidak ditemukan"); return; }
            let isPdf = item.bukti_bayar.startsWith("data:application/pdf");
            let contentHtml = isPdf 
                ? `<iframe src="${item.bukti_bayar}" style="width:100%; height:500px; border:none; border-radius:8px;"></iframe>`
                : `<img src="${item.bukti_bayar}" style="max-width:100%; max-height:65vh; border-radius:8px; display:block; margin:0 auto;">`;
            Swal.fire({
                title: 'Bukti Bayar',
                html: `
                    <div style="text-align:center; margin-bottom:12px; font-size:12px; color:var(--muted);">
                        <b style="color:var(--text);">${item.uraian}</b><br>
                        ${item.bukti_bayar_nama || '-'} • ${formatDate(item.tanggal)} • ${rupiah(item.total)}
                    </div>
                    ${contentHtml}
                    <div style="margin-top:15px; display:flex; gap:8px; justify-content:center;">
                        <a href="${item.bukti_bayar}" download="${item.bukti_bayar_nama || 'bukti'}" class="btn btn-primary" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:8px 16px;">
                            <i class="fa-solid fa-download"></i> Download
                        </a>
                    </div>`,
                width: isPdf ? '750px' : '650px',
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        /* =====================================================
           HELPER
        ===================================================== */
        function getKategoriPendapatanList() {
            let list = db["Kategori Pendapatan"] || [];
            if (list.length === 0) {
                list = [{nama: "Dana BOS"}, {nama: "Sumbangan Pendidikan"}, {nama: "Pendapatan Lain-lain"}];
                db["Kategori Pendapatan"] = list;
                saveDB();
            }
            let normalized = list.map(k => typeof k === 'string' ? {nama: k} : {nama: k.nama});
            if (JSON.stringify(list) !== JSON.stringify(normalized)) {
                db["Kategori Pendapatan"] = normalized;
                saveDB();
            }
            return normalized;
        }
        function getGuruList() { return (db["Pengguna"] || []).filter(u => u.role === "guru"); }

                /* =====================================================
           FORMAT TANGGAL INDONESIA (untuk cetak rekap)
        ===================================================== */
        function formatTanggalIndo(dateStr) {
            if (!dateStr) return "-";
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", 
                            "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const d = new Date(dateStr);
            if (isNaN(d)) return "-";
            return `${d.getDate().toString().padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        /* =====================================================
           KATEGORI BELANJA — HELPER & CRUD
        ===================================================== */
        function getKategoriBelanjaList() {
            let list = db["Kategori Belanja"] || [];
            if (list.length === 0) {
                // Inisialisasi awal dengan kategori default
                list = [
                    {nama: "ATK"},
                    {nama: "Operasional"},
                    {nama: "Kegiatan Pembelajaran"},
                    {nama: "Perlengkapan Kelas"}
                ];
                db["Kategori Belanja"] = list;
                saveDB();
            }
            return list.map(k => typeof k === 'string' ? {nama: k} : {nama: k.nama});
        }

        function openKategoriBelanjaModal() {
            document.getElementById("newKategoriBelanjaName").value = "";
            renderKategoriBelanjaList();
            document.getElementById("modalKategoriBelanja").classList.add("show");
        }

        function closeKategoriBelanjaModal() {
            document.getElementById("modalKategoriBelanja").classList.remove("show");
        }

        function renderKategoriBelanjaList() {
            let kategoris = getKategoriBelanjaList();
            let rabAdmin = (db["Rencana Anggaran"] || []).filter(x => !x.nama_guru);
            let container = document.getElementById("kategoriBelanjaListContainer");
            
            if (kategoris.length === 0) {
                container.innerHTML = `<div class="kat-empty">
                    <i class="fa-solid fa-inbox" style="font-size: 28px; display: block; margin-bottom: 10px; opacity: 0.4;"></i>
                    Belum ada kategori. Tambahkan kategori baru di atas.
                </div>`;
                return;
            }
            
            container.innerHTML = kategoris.map((k, idx) => {
                let nama = k.nama;
                let items = rabAdmin.filter(x => x.kategori_belanja === nama);
                let count = items.length;
                let totalKat = items.reduce((s, x) => s + (Number(x.total) || 0), 0);
                return `
                <div class="kat-row">
                    <div class="kat-info">
                        <div class="kat-name">${nama}</div>
                        <div class="kat-usage">${count} item RAB • ${rupiah(totalKat)}</div>
                    </div>
                    <div class="kat-actions">
                        <button class="btn btn-light btn-sm" onclick="editKategoriBelanja(${idx})" title="Ubah nama">
                            <i class="fa-solid fa-pen" style="color: var(--primary2);"></i>
                        </button>
                        <button class="btn btn-light btn-sm" style="background:#fff5f5; border:1px solid #ffcccc;" onclick="hapusKategoriBelanja(${idx})" title="Hapus">
                            <i class="fa-solid fa-trash" style="color: var(--danger);"></i>
                        </button>
                    </div>
                </div>`;
            }).join("");
        }

        function tambahKategoriBelanja() {
            let nama = document.getElementById("newKategoriBelanjaName").value.trim();
            if (!nama) { toast("Masukkan nama kategori!"); return; }
            
            let kategoris = getKategoriBelanjaList();
            if (kategoris.some(k => k.nama.toLowerCase() === nama.toLowerCase())) {
                toast("Kategori dengan nama ini sudah ada!");
                return;
            }
            
            if (!db["Kategori Belanja"]) db["Kategori Belanja"] = [];
            db["Kategori Belanja"].push({nama: nama});
            saveDB();
            
            document.getElementById("newKategoriBelanjaName").value = "";
            renderKategoriBelanjaList();
            toast(`Kategori "${nama}" berhasil ditambahkan`);
        }

        function editKategoriBelanja(idx) {
            let kategoris = getKategoriBelanjaList();
            let oldNama = kategoris[idx].nama;
            
            Swal.fire({
                title: 'Ubah Nama Kategori',
                input: 'text',
                inputValue: oldNama,
                inputPlaceholder: 'Nama kategori baru...',
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#1d5d9b',
                inputValidator: (val) => {
                    if (!val || !val.trim()) return 'Nama tidak boleh kosong';
                    let v = val.trim();
                    if (v.toLowerCase() !== oldNama.toLowerCase() && kategoris.some(k => k.nama.toLowerCase() === v.toLowerCase())) {
                        return 'Nama kategori sudah digunakan';
                    }
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    let newNama = res.value.trim();
                    if (newNama === oldNama) return;
                    
                    // Update kategori
                    db["Kategori Belanja"][idx] = {nama: newNama};
                    
                    // Update semua RAB & Pengeluaran yang pakai kategori ini
                    (db["Rencana Anggaran"] || []).forEach(x => {
                        if (x.kategori_belanja === oldNama) x.kategori_belanja = newNama;
                    });
                    (db["Rencana Pengeluaran"] || []).forEach(x => {
                        if (x.kategori_belanja === oldNama) x.kategori_belanja = newNama;
                    });
                    
                    saveDB();
                    renderKategoriBelanjaList();
                    toast(`Kategori diubah menjadi "${newNama}"`);
                }
            });
        }

        function hapusKategoriBelanja(idx) {
            let kategoris = getKategoriBelanjaList();
            let nama = kategoris[idx].nama;
            
            // Cek pemakaian
            let countRAB = (db["Rencana Anggaran"] || []).filter(x => x.kategori_belanja === nama).length;
            let countPeng = (db["Rencana Pengeluaran"] || []).filter(x => x.kategori_belanja === nama).length;
            
            if (countRAB > 0 || countPeng > 0) {
                let info = [];
                if (countRAB > 0) info.push(`<b>${countRAB} item RAB</b>`);
                if (countPeng > 0) info.push(`<b>${countPeng} transaksi pengeluaran</b>`);
                Swal.fire({
                    title: 'Tidak Bisa Dihapus',
                    html: `Kategori <b>"${nama}"</b> masih dipakai oleh ${info.join(" dan ")}.<br><br>Pindahkan atau hapus data tersebut terlebih dahulu.`,
                    icon: 'warning',
                    confirmButtonText: 'Mengerti'
                });
                return;
            }
            
            Swal.fire({
                title: 'Hapus Kategori?',
                html: `Kategori <b>"${nama}"</b> akan dihapus permanen.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonText: 'Batal',
                confirmButtonText: 'Ya, Hapus'
            }).then((res) => {
                if (res.isConfirmed) {
                    db["Kategori Belanja"].splice(idx, 1);
                    saveDB();
                    renderKategoriBelanjaList();
                    toast(`Kategori "${nama}" dihapus`);
                }
            });
        }
        /* =====================================================
           TOGGLE SUMBER DANA COLLAPSIBLE
        ===================================================== */
        function toggleSumberDanaCollapse() {
            let el = document.getElementById("sumberDanaCollapse");
            if (!el) return;
            el.classList.toggle("open");
            // Update hint text
            let hint = el.querySelector(".sdc-header-hint");
            if (hint) {
                hint.innerText = el.classList.contains("open") ? "Klik untuk sembunyikan" : "Klik untuk lihat detail";
            }
        }

        /* =====================================================
           TOGGLE COLLAPSE (Generic)
        ===================================================== */
        function toggleCollapse(id) {
            let el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle("open");
            let hint = el.querySelector(".sdc-header-hint");
            if (hint) {
                hint.innerText = el.classList.contains("open") 
                    ? "Klik untuk sembunyikan" 
                    : "Klik untuk lihat detail";
            }
        }

        /* =====================================================
           DETAIL KATEGORI PENGELUARAN — Popup Side-by-Side
        ===================================================== */
        function openDetailKategoriPengeluaran(kategori, evt) {
            if (evt) evt.stopPropagation();

            // Ambil RAB admin di kategori ini
            let rabList = getView("Rencana Anggaran").filter(x => 
                !x.nama_guru && (x.kategori_belanja || "(Tanpa Kategori)") === kategori
            );
            // Ambil pengeluaran admin di kategori ini
            let pengeluaranList = getView("Rencana Pengeluaran").filter(x => 
                !x._from_guru && (x.kategori_belanja || "(Tanpa Kategori)") === kategori
            );

            // Merge per item RAB dengan realisasinya (by rencana_id)
            let items = rabList.map(rab => {
                let pengs = pengeluaranList.filter(p => p.rencana_id === rab.id);
                let volTer = pengs.reduce((s, p) => s + (Number(p.volume) || 0), 0);
                let totalTer = pengs.reduce((s, p) => s + (Number(p.total) || 0), 0);
                let volRencana = Number(rab.volume) || 0;
                let totalRencana = Number(rab.total) || 0;
                return {
                    uraian: rab.uraian,
                    volRencana,
                    hargaSatuan: Number(rab.nilai) || 0,
                    totalRencana,
                    volTer,
                    totalTer,
                    sisaVol: volRencana - volTer,
                    sisaTotal: totalRencana - totalTer,
                    persen: totalRencana > 0 ? Math.round((totalTer / totalRencana) * 100) : 0,
                    detailPengeluaran: pengs
                };
            });

            let totalPlafon = items.reduce((s, x) => s + x.totalRencana, 0);
            let totalReal = items.reduce((s, x) => s + x.totalTer, 0);
            let totalSisa = totalPlafon - totalReal;
            let persenTotal = totalPlafon > 0 ? Math.round((totalReal / totalPlafon) * 100) : 0;

            document.getElementById("detailKatPengTitle").innerHTML = `<i class="fa-solid fa-folder-open" style="margin-right:8px;"></i> Kategori: ${kategori}`;
            document.getElementById("detailKatPengSubtitle").innerHTML = 
                `${items.length} item RAB • Plafon: <b>${rupiah(totalPlafon)}</b> • ` +
                `Terealisasi: <b>${rupiah(totalReal)}</b> (${persenTotal}%) • ` +
                `Sisa Belum Terealisasi: <b>${rupiah(totalSisa)}</b>`;

            let tbody = "";
            if (items.length === 0) {
                tbody = `<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--muted);">
                    <i class="fa-solid fa-inbox" style="font-size:30px; opacity:0.3; display:block; margin-bottom:8px;"></i>
                    Belum ada item RAB di kategori ini.
                </td></tr>`;
            } else {
                tbody = items.map((x, i) => {
                    let barColor = x.persen >= 100 ? '#22c55e' : (x.persen >= 50 ? '#f59e0b' : '#94a3b8');
                    let statusLabel = x.persen >= 100 ? 'Selesai' : (x.persen > 0 ? 'Sebagian' : 'Belum');
                    let statusBg = x.persen >= 100 ? '#dcfce7' : (x.persen > 0 ? '#fef3c7' : '#f1f5f9');
                    let statusFg = x.persen >= 100 ? '#15803d' : (x.persen > 0 ? '#92400e' : '#64748b');

                    return `<tr>
                        <td style="text-align:center; font-size:12px;">${i+1}</td>
                        <td><strong style="font-size:13px;">${x.uraian}</strong></td>
                        
                        <!-- RENCANA -->
                        <td style="text-align:center; background:#eff6ff; font-size:12px;">${x.volRencana}</td>

        function openDetailRab(guru, tahun) {
            let rab = getView("Rencana Anggaran").filter(x => x.nama_guru === guru && x.tahun === tahun);
            let plafonObj = getView("Anggaran Kebutuhan Guru").find(x => x.guru === guru && x.tahun === tahun);
            let plafon = plafonObj ? Number(plafonObj.plafon) : 0;
            let totalRAB = rab.reduce((s, x) => s + (Number(x.total) || 0), 0);
            let totalRealisasi = hitungTotalRealisasiGuru(guru, tahun);
            let sisaPlafon = plafon - totalRAB;
            let persenSerapan = plafon > 0 ? Math.round((totalRAB / plafon) * 100) : 0;
            let persenRealisasi = plafon > 0 ? Math.round((totalRealisasi / plafon) * 100) : 0;

            document.getElementById("detailRabTitle").innerHTML = `<i class="fa-solid fa-file-invoice-dollar" style="margin-right:8px;"></i> RAB ${guru}`;
            document.getElementById("detailRabSubtitle").innerText = `Tahun Anggaran ${tahun} • ${rab.length} item kebutuhan`;

            document.getElementById("detailRabSummary").innerHTML = `
                <div class="rab-summary-grid">
                    <div class="rab-summary-item"><div class="label">Plafon</div><div class="value primary">${rupiah(plafon)}</div></div>
                    <div class="rab-summary-item"><div class="label">Dianggarkan</div><div class="value warning">${rupiah(totalRAB)}</div></div>
                    <div class="rab-summary-item"><div class="label">Realisasi</div><div class="value danger">${rupiah(totalRealisasi)}</div></div>
                    <div class="rab-summary-item"><div class="label">Sisa Plafon</div><div class="value success">${rupiah(sisaPlafon)}</div></div>
                    <div class="rab-summary-item"><div class="label">Serapan RAB</div><div class="value primary">${persenSerapan}%</div></div>
                    <div class="rab-summary-item"><div class="label">Realisasi Dana</div><div class="value danger">${persenRealisasi}%</div></div>
                </div>`;

            if (rab.length === 0) {
                document.getElementById("detailRabContent").innerHTML = `
                <div style="text-align:center; padding: 40px; color: var(--muted); background:#f8fafc; border-radius:10px;">
                    <i class="fa-solid fa-inbox" style="font-size: 36px; opacity: 0.3; display: block; margin-bottom: 10px;"></i>
                    Guru ini belum menyusun Rencana Anggaran.
                </div>`;
            } else {
                let groups = {};
                rab.forEach(it => {
                    let kat = it.kategori_belanja || "(Tanpa Kategori)";
                    if (!groups[kat]) groups[kat] = [];
                    groups[kat].push(it);
                });
                let kategoriKeys = Object.keys(groups).sort();

                let tableHtml = kategoriKeys.map(kat => {
                    let itemsKat = groups[kat];
                    let totalKatRAB = itemsKat.reduce((s, x) => s + (Number(x.total) || 0), 0);
                    let totalKatReal = itemsKat.reduce((s, x) => s + hitungRealisasiPerItem(guru, tahun, x.uraian), 0);
                    return `
                    <div style="margin-bottom: 18px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;">
                        <div style="background: #f1f5f9; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                            <div style="font-weight: bold; color: var(--primary); font-size: 13px;">
                                <i class="fa-solid fa-folder-open" style="margin-right: 6px; color: var(--primary2);"></i> ${kat}
                            </div>
                            <div style="font-size: 11px; color: var(--muted);">
                                RAB: <b style="color: var(--primary);">${rupiah(totalKatRAB)}</b> • 
                                Realisasi: <b style="color: var(--danger);">${rupiah(totalKatReal)}</b>
                            </div>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 40px; text-align:center;">No</th>
                                        <th>Uraian</th>
                                        <th style="text-align:center;">Vol</th>
                                        <th style="text-align:right;">Harga Satuan</th>
                                        <th style="text-align:right;">Total Anggaran</th>
                                        <th style="text-align:right;">Realisasi Penggunaan</th>
                                        <th style="text-align:center;">%</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${itemsKat.map((item, idx) => {
                                        let realItem = hitungRealisasiPerItem(guru, tahun, item.uraian);
                                        let persen = item.total > 0 ? Math.round((realItem / item.total) * 100) : 0;
                                        let color = persen >= 100 ? 'var(--success)' : (persen >= 50 ? 'var(--warning)' : 'var(--muted)');
                                        return `
                                        <tr>
                                            <td style="text-align:center;">${idx+1}</td>
                                            <td><strong>${item.uraian}</strong></td>
                                            <td style="text-align:center;">${item.volume}</td>
                                            <td style="text-align:right;">${rupiah(item.nilai)}</td>
                                            <td style="text-align:right; font-weight:bold; color:var(--primary);">${rupiah(item.total)}</td>
                                            <td style="text-align:right; font-weight:bold; color:var(--danger);">${rupiah(realItem)}</td>
                                            <td style="text-align:center; font-weight:bold; color: ${color};">${persen}%</td>
                                        </tr>`;
                                    }).join("")}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
                }).join("");

                document.getElementById("detailRabContent").innerHTML = tableHtml;
            }

            document.getElementById("modalDetailRab").classList.add("show");
        }

            let tahunHtml = `<input type="text" id="ag_tahun" value="${item?.tahun || tahunDefault}" readonly style="background:#eef2f6; font-weight:bold;">`;

            document.getElementById("dataForm").innerHTML = `
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Nama Guru</label>
                        <select id="ag_guru" required><option value="">-- Pilih Guru --</option>${guruOpts}</select>
                    </div>
                    <div class="form-group">
                        <label>Tahun Anggaran (Otomatis)</label>

                    <div class="form-group">
                        <label>Status</label>

                            <option value="Nonaktif" ${item?.status === "Nonaktif" ? 'selected' : ''}>Nonaktif</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Plafon Anggaran (Rp)</label>
                        <input type="text" id="ag_plafon" value="${item ? Number(item.plafon).toLocaleString('id-ID') : ''}" oninput="formatRupiahInput(this)" placeholder="Contoh: 10.000.000" required>
                    </div>
                    <div class="form-group full">
                        <label>Keterangan (Opsional)</label>
                        <textarea id="ag_keterangan">${item?.keterangan || ''}</textarea>
                    </div>
                </div>
                <br>
                <button type="button" class="btn btn-success" onclick="saveFormAnggaranGuru(${id || "null"})"><i class="fa-solid fa-save"></i> Simpan</button>
                <button type="button" class="btn btn-light" onclick="closeModal()">Batal</button>`;
        }

        function saveFormAnggaranGuru(id) {
            let guru = document.getElementById("ag_guru").value;
            let tahun = document.getElementById("ag_tahun").value;
            let status = document.getElementById("ag_status").value;
            let plafon = Number(document.getElementById("ag_plafon").value.replace(/\./g, '')) || 0;
            let keterangan = document.getElementById("ag_keterangan").value;
            if (!guru || !tahun || !plafon) { toast("Lengkapi semua kolom!"); return; }
            let existing = (db["Anggaran Kebutuhan Guru"] || []).find(x => x.guru === guru && x.tahun === tahun && x.id !== id);
            if (existing) { Swal.fire('Duplikat!', `Sudah ada plafon untuk <b>${guru}</b> tahun <b>${tahun}</b>.`, 'warning'); return; }
            if (!db["Anggaran Kebutuhan Guru"]) db["Anggaran Kebutuhan Guru"] = [];
            if (id) {
                let idx = db["Anggaran Kebutuhan Guru"].findIndex(x => x.id === id);
                db["Anggaran Kebutuhan Guru"][idx] = { ...db["Anggaran Kebutuhan Guru"][idx], guru, tahun, status, plafon, keterangan };
                toast("Plafon diperbarui");
            } else {
                db["Anggaran Kebutuhan Guru"].push({ id: Date.now(), guru, tahun, status, plafon, keterangan });
                toast("Plafon ditetapkan");
            }
            saveDB(); closeModal(); renderAnggaranKebutuhanGuru();
        }

        function toggleStatusPlafon(id) {
            let idx = (db["Anggaran Kebutuhan Guru"] || []).findIndex(x => x.id === id);
            if (idx === -1) return;
            let curr = db["Anggaran Kebutuhan Guru"][idx];
            let nextStatus = curr.status === "Aktif" ? "Nonaktif" : "Aktif";
            Swal.fire({
                title: `${nextStatus === "Aktif" ? "Aktifkan" : "Nonaktifkan"} Plafon?`,
                html: `Plafon <b>${curr.guru}</b> akan diubah menjadi <b>${nextStatus}</b>.`,
                icon: 'question', showCancelButton: true, confirmButtonText: 'Ya', cancelButtonText: 'Batal',
                confirmButtonColor: nextStatus === "Aktif" ? '#198754' : '#dc3545'
            }).then(res => {
                if (res.isConfirmed) {
                    db["Anggaran Kebutuhan Guru"][idx].status = nextStatus;
                    saveDB(); renderAnggaranKebutuhanGuru();
                    toast(`Plafon ${curr.guru} ${nextStatus.toLowerCase()}`);
                }
            });
        }

        function hapusPlafonGuru(id) {
            Swal.fire({
                title: 'Hapus Plafon?', text: 'Plafon ini akan dihapus.',
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'Ya, Hapus', cancelButtonText: 'Batal'
            }).then(res => {
                if (res.isConfirmed) {
                    db["Anggaran Kebutuhan Guru"] = (db["Anggaran Kebutuhan Guru"] || []).filter(x => x.id !== id);
                    saveDB(); renderAnggaranKebutuhanGuru(); toast("Plafon dihapus");
                }
            });
        }

        /* =====================================================
           KATEGORI PENDAPATAN
        ===================================================== */
        function renderKategoriPendapatanWidgets(dataPendapatan, grandTotal) {
            let kategoris = getKategoriPendapatanList();
            return kategoris.map(k => {
                let items = dataPendapatan.filter(x => x.kategori === k.nama);
                let totalKat = items.reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
                let persen = grandTotal > 0 ? Math.min(100, Math.round((totalKat / grandTotal) * 100)) : 0;
                return `
                <div class="kategori-widget">
                    <div class="kw-header"><div class="kw-title">${k.nama}</div><div class="kw-count">${items.length} trx</div></div>
                    <div class="kw-value">${rupiah(totalKat)}</div>
                    <div class="kw-bar"><div class="kw-bar-inner" style="width: ${persen}%;"></div></div>
                    <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">${persen}% dari total</div>
                </div>`;
            }).join("");
        }
        function openKategoriModal() { document.getElementById("newKategoriName").value = ""; renderKategoriList(); document.getElementById("modalKategori").classList.add("show"); }
        function closeKategoriModal() { document.getElementById("modalKategori").classList.remove("show"); }

        function renderKategoriList() {
            let kategoris = getKategoriPendapatanList();
            let pendapatan = db["Pendapatan"] || [];
            let container = document.getElementById("kategoriListContainer");
            if (kategoris.length === 0) { container.innerHTML = `<div class="kat-empty">Belum ada kategori.</div>`; return; }
            container.innerHTML = kategoris.map((k, idx) => {
                let count = pendapatan.filter(x => x.kategori === k.nama).length;
                let totalKat = pendapatan.filter(x => x.kategori === k.nama).reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
                return `<div class="kat-row">
                    <div class="kat-info"><div class="kat-name">${k.nama}</div><div class="kat-usage">${count} trx • ${rupiah(totalKat)}</div></div>
                    <div class="kat-actions">
                        <button class="btn btn-light btn-sm" onclick="editKategoriPendapatan(${idx})"><i class="fa-solid fa-pen" style="color: var(--primary2);"></i></button>
                        <button class="btn btn-light btn-sm" style="background:#fff5f5; border:1px solid #ffcccc;" onclick="hapusKategoriPendapatan(${idx})"><i class="fa-solid fa-trash" style="color: var(--danger);"></i></button>
                    </div>
                </div>`;
            }).join("");
        }
        function tambahKategoriPendapatan() {
            let nama = document.getElementById("newKategoriName").value.trim();
            if (!nama) { toast("Isi nama kategori!"); return; }
            let kategoris = getKategoriPendapatanList();
            if (kategoris.some(k => k.nama.toLowerCase() === nama.toLowerCase())) { toast("Kategori sudah ada!"); return; }
            db["Kategori Pendapatan"].push({nama});
            saveDB(); document.getElementById("newKategoriName").value = ""; renderKategoriList();
            toast(`Kategori "${nama}" ditambahkan`);
        }
        function editKategoriPendapatan(idx) {
            let kategoris = getKategoriPendapatanList();
            let oldNama = kategoris[idx].nama;
            Swal.fire({
                title: 'Ubah Nama Kategori', input: 'text', inputValue: oldNama,
                showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', confirmButtonColor: '#1d5d9b',
                inputValidator: (val) => {
                    if (!val || !val.trim()) return 'Nama wajib diisi';
                    let v = val.trim();
                    if (v.toLowerCase() !== oldNama.toLowerCase() && kategoris.some(k => k.nama.toLowerCase() === v.toLowerCase())) return 'Nama sudah dipakai';
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    let newNama = res.value.trim();
                    if (newNama === oldNama) return;
                    db["Kategori Pendapatan"][idx] = {nama: newNama};
                    (db["Pendapatan"] || []).forEach(x => { if (x.kategori === oldNama) x.kategori = newNama; });
                    saveDB(); renderKategoriList();
                    toast(`Diubah ke "${newNama}"`);
                }
            });
        }
        function hapusKategoriPendapatan(idx) {
            let kategoris = getKategoriPendapatanList(); let nama = kategoris[idx].nama;
            let count = (db["Pendapatan"] || []).filter(x => x.kategori === nama).length;
            if (count > 0) { Swal.fire('Tidak Bisa Dihapus', `Kategori <b>${nama}</b> masih dipakai ${count} transaksi.`, 'warning'); return; }
            Swal.fire({ title: 'Hapus Kategori?', html: `Hapus <b>"${nama}"</b>?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'Ya', cancelButtonText: 'Batal' }).then(res => {
                if (res.isConfirmed) {
                    db["Kategori Pendapatan"].splice(idx, 1);
                    saveDB(); renderKategoriList();
                    toast(`Kategori "${nama}" dihapus`);
                }
            });

        function renderRencanaPengeluaranRows(data) {
            if (data.length === 0) return `<tr><td colspan="10" style="text-align:center; padding: 20px; color: var(--muted);">Belum ada data tahun ${TAHUN_AKTIF || '-'}</td></tr>`;

                let sumber = row.sumber_dana && row.sumber_dana !== "-" ? `<span class="badge badge-success"><i class="fa-solid fa-wallet"></i> ${row.sumber_dana}</span>` : "-";
                let stat = row.status === "Tunai" ? `<span class="badge badge-success">Tunai</span>` : `<span class="badge badge-warning">${row.status || '-'}</span>`;
                let kategori = row.kategori_belanja ? `<span class="badge badge-info">${row.kategori_belanja}</span>` : `<span style="color:var(--muted); font-size:11px;">-</span>`;
                let buktiCell = row.bukti_bayar 
                    ? `<button class="btn btn-light btn-sm" onclick="lihatBukti(${row.id})" style="border: 1px solid #dce3ea;"><i class="fa-solid ${row.bukti_bayar.startsWith('data:application/pdf') ? 'fa-file-pdf' : 'fa-image'}" style="color: var(--primary2);"></i></button>` 
                    : `<span style="color:var(--muted); font-size:11px;">-</span>`;
                return `<tr>
                    <td>${row.nomor || "-"}</td>
                    <td>${formatDate(row.tanggal)}</td>
                    <td>${row.uraian || "-"}</td>
                    <td>${kategori}</td>
                    <td style="text-align:center;">${row.volume || 1}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--danger);">${rupiah(row.total)}</td>
                    <td>${sumber}</td>
                    <td style="text-align:center;">${buktiCell}</td>
                    <td style="text-align:center;">${stat}</td>
                    <td style="text-align:center;">
                        <button class="btn btn-light btn-sm" onclick="openForm('Rencana Pengeluaran',${row.id})"><i class="fa-solid fa-pen" style="color: #1d5d9b;"></i></button>
                        <button class="btn btn-light btn-sm" onclick="deleteData('Rencana Pengeluaran',${row.id})" style="background-color: #fff5f5; border: 1px solid #ffcccc;"><i class="fa-solid fa-trash" style="color: #dc3545;"></i></button>
                    </td>
                </tr>`;
            }).join("");
        }
        function renderRows(name, data, columns){
            if(data.length === 0) return `<tr><td colspan="${columns.length+1}" style="text-align:center; padding: 20px; color: var(--muted);">Belum ada data tahun ${TAHUN_AKTIF || '-'}</td></tr>`;
            return data.map(row => `<tr>
                ${columns.map(c => {
                    let value = row[c];
                    if (c === "nilai" || c === "total" || c === "jumlah") value = rupiah(value);
                    else if (c === "tanggal") value = formatDate(value);
                    else if (c === "status") value = `<span class="badge ${(value === 'Tunai' || value === 'Aktif') ? 'badge-success' : 'badge-warning'}">${value || '-'}</span>`;
                    else if (c === "kategori_belanja") value = value ? `<span class="badge badge-info">${value}</span>` : "-";
                    return `<td>${value ?? "-"}</td>`;
                }).join("")}
                <td>
                    <button class="btn btn-light btn-sm" onclick="openForm('${name}',${row.id})"><i class="fa-solid fa-pen" style="color: #1d5d9b;"></i></button>
                    <button class="btn btn-light btn-sm" onclick="deleteData('${name}',${row.id})" style="background-color: #fff5f5; border: 1px solid #ffcccc;"><i class="fa-solid fa-trash" style="color: #dc3545;"></i></button>
                </td>

        function applyGuruRealFilter(keepFilter = false) {
            if (!keepFilter) {

                guruRealState.page = 1;

            let filtered = guruRealState.data.slice();
            if (guruRealState.startDate) filtered = filtered.filter(x => x.tanggal && x.tanggal >= guruRealState.startDate);
            if (guruRealState.endDate) filtered = filtered.filter(x => x.tanggal && x.tanggal <= guruRealState.endDate);
            if (guruRealState.filterValue) {
                let kw = guruRealState.filterValue.toLowerCase();
                if (guruRealState.filterField) {
                    filtered = filtered.filter(x => String(x[guruRealState.filterField] || "").toLowerCase().includes(kw));

                    filtered = filtered.filter(x => Object.values(x).join(" ").toLowerCase().includes(kw));

            let totalPages = Math.ceil(guruRealState.filtered.length / guruRealState.pageSize) || 1;
            let newPage = guruRealState.page + delta;
            if (newPage < 1) newPage = 1;
            if (newPage > totalPages) newPage = totalPages;
            guruRealState.page = newPage;
            renderGuruRealisasiTable();
        }

        function buildRekapData() {
            // Kategori pendapatan (kecuali yang mengandung "saldo awal")
            let kategoriPendapatanList = (db["Kategori Pendapatan"] || [])
                .map(k => typeof k === 'string' ? k : k.nama)
                .filter(k => k && !k.toLowerCase().includes("saldo awal"));
            
            // Kategori belanja: GABUNG dari Master Kategori Belanja + Semua RAB (admin + guru)
            let kategoriSet = new Set();
            // 1. Dari master Kategori Belanja
            (db["Kategori Belanja"] || []).forEach(k => {
                let nama = typeof k === 'string' ? k : k.nama;
                if (nama) kategoriSet.add(nama);
            });
            // 2. Dari semua RAB (admin + guru)
            (db["Rencana Anggaran"] || []).forEach(x => {
                if (x.kategori_belanja) kategoriSet.add(x.kategori_belanja);
            });
            let kategoriBelanjaList = [...kategoriSet].sort();
            
            // Filter data tahun aktif
            let pendapatanYear = getView("Pendapatan");
            let pengAdminYear = getView("Rencana Pengeluaran").filter(x => !x._from_guru);
            let pengGuruYear = getView("Pengajuan").filter(x => x.approval_status === "Disetujui");
            let rabAdminYear = getView("Rencana Anggaran").filter(x => !x.nama_guru);
            let plafonGuruList = (db["Anggaran Kebutuhan Guru"] || [])
                .filter(x => String(x.tahun) === String(TAHUN_AKTIF) && x.status === "Aktif");
            
            // Saldo Awal dari pendapatan kategori mengandung "saldo awal"
            let saldoAwalTotal = pendapatanYear
                .filter(x => (x.kategori || "").toLowerCase().includes("saldo awal"))
                .reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
            
            // Helper: dapatkan kategori_belanja dari pengajuan (fallback cari di RAB guru)
            function getKategoriFromPengajuan(p) {
                if (p.kategori_belanja) return p.kategori_belanja;
                let rab = (db["Rencana Anggaran"] || []).find(x => x.nama_guru === p.nama_guru && x.uraian === p.uraian_anggaran);
                return rab ? (rab.kategori_belanja || "(Tanpa Kategori)") : "(Tanpa Kategori)";
            }
            
            // === BARIS ADMIN ===
            let adminRow = {
                pengguna: "Admin",
                anggaran: rabAdminYear.reduce((s, x) => s + (Number(x.total) || 0), 0),
                saldoAwal: saldoAwalTotal,
                pendapatan: {},
                belanja: {}
            };
            kategoriPendapatanList.forEach(kat => {
                adminRow.pendapatan[kat] = pendapatanYear
                    .filter(x => (x.kategori || "") === kat)
                    .reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
            });
            adminRow.totalPendapatan = Object.values(adminRow.pendapatan).reduce((s, v) => s + v, 0);
            
            kategoriBelanjaList.forEach(kat => {
                adminRow.belanja[kat] = pengAdminYear
                    .filter(x => (x.kategori_belanja || "(Tanpa Kategori)") === kat)
                    .reduce((s, x) => s + (Number(x.total) || 0), 0);
            });
            adminRow.totalBelanja = Object.values(adminRow.belanja).reduce((s, v) => s + v, 0);
            adminRow.jumlah = adminRow.totalPendapatan - adminRow.totalBelanja;
            
            // === BARIS GURU ===
            let guruRows = plafonGuruList.map(pg => {
                let guru = pg.guru;
                let pengGuru = pengGuruYear.filter(x => x.nama_guru === guru);
                let row = {
                    pengguna: guru,
                    anggaran: Number(pg.plafon) || 0,
                    saldoAwal: 0,
                    pendapatan: {},
                    belanja: {}
                };
                kategoriPendapatanList.forEach(kat => { row.pendapatan[kat] = 0; });
                row.totalPendapatan = 0;
                
                kategoriBelanjaList.forEach(kat => {
                    row.belanja[kat] = pengGuru
                        .filter(x => getKategoriFromPengajuan(x) === kat)
                        .reduce((s, x) => s + (Number(x.total) || 0), 0);
                });
                row.totalBelanja = Object.values(row.belanja).reduce((s, v) => s + v, 0);
                row.jumlah = 0 - row.totalBelanja;
                return row;
            });
            
            // === GRAND TOTAL ===
            let grandTotal = {
                anggaran: adminRow.anggaran + guruRows.reduce((s, r) => s + r.anggaran, 0),
                saldoAwal: adminRow.saldoAwal,
                pendapatan: {},
                belanja: {},
                totalPendapatan: adminRow.totalPendapatan,
                totalBelanja: adminRow.totalBelanja + guruRows.reduce((s, r) => s + r.totalBelanja, 0)
            };
            kategoriPendapatanList.forEach(kat => {
                grandTotal.pendapatan[kat] = adminRow.pendapatan[kat];
            });
            kategoriBelanjaList.forEach(kat => {
                grandTotal.belanja[kat] = adminRow.belanja[kat] + guruRows.reduce((s, r) => s + (r.belanja[kat] || 0), 0);
            });
            grandTotal.jumlah = grandTotal.totalPendapatan - grandTotal.totalBelanja;
            
            return {
                tahun: TAHUN_AKTIF,
                sekolah: db.profile || { nama: "SD GIM BEKASI", kepala: "Kepala Sekolah", bendahara: "Bendahara" },
                kategoriPendapatanList,
                kategoriBelanjaList,
                rows: [adminRow, ...guruRows],
                grandTotal,
                tanggalCetak: new Date()
            };
        }

                function printRekapRealisasi() {
            try {
                if (!TAHUN_AKTIF) {
                    Swal.fire('Tahun Belum Aktif', 'Aktifkan tahun anggaran terlebih dahulu.', 'warning');
                    return;
                }
                
                let data = buildRekapData();
                
                // Cek ada data atau tidak
                let adaData = data.rows.some(r => 
                    r.totalPendapatan > 0 || r.totalBelanja > 0 || r.anggaran > 0
                );
                
                if (!adaData) {
                    Swal.fire('Tidak Ada Data', 'Belum ada data untuk dicetak pada tahun ini.', 'info');
                    return;
                }
                
                let html = generateRekapPrintHtml(data);
                
                // Coba buka window baru
                let printWindow = null;
                try {
                    printWindow = window.open('', '_blank', 'width=1400,height=900');
                } catch (e) {
                    printWindow = null;
                }
                
                if (!printWindow || printWindow.closed || typeof printWindow.closed === 'undefined') {
                    // Popup diblokir — gunakan fallback iframe
                    tampilkanFallbackPrint(html);
                    return;
                }
                
                printWindow.document.open();
                printWindow.document.write(html);
                printWindow.document.close();
                printWindow.focus();
                
            } catch (err) {
                console.error("Print error:", err);
                Swal.fire({
                    title: 'Gagal Mencetak',
                    html: `Terjadi kesalahan saat mencetak laporan.<br><br>
                           <small style="color:var(--muted); font-size:12px;">Error: ${err.message || 'Unknown'}</small>`,
                    icon: 'error'
                });
            }
        }

            Swal.fire({

                        Popup diblokir browser. Klik tombol di bawah untuk membuka laporan di tab baru.

                    <div style="background:#fff8e6; border-left:3px solid #f59e0b; padding:10px 12px; border-radius:6px; text-align:left; font-size:12px; color:#92400e;">
                        <b>Tips:</b> Saat dialog muncul, izinkan popup untuk website ini agar ke depannya bisa langsung terbuka.
                    </div>
                `,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: '<i class="fa-solid fa-external-link-alt"></i> Buka di Tab Baru',
                cancelButtonText: 'Batal',

            }).then((res) => {

        function applyRealisasiFilter(keepFilter = false) {
            if (!keepFilter) {
                realisasiState.startDate = document.getElementById("rkStart").value || "";
                realisasiState.endDate = document.getElementById("rkEnd").value || "";
                realisasiState.filterField = document.getElementById("rkField").value || "";
                realisasiState.filterValue = (document.getElementById("rkValue").value || "").trim();
                realisasiState.page = 1;
            } else {
                let elStart = document.getElementById("rkStart"); if (elStart) realisasiState.startDate = elStart.value || "";
                let elEnd = document.getElementById("rkEnd"); if (elEnd) realisasiState.endDate = elEnd.value || "";
                let elField = document.getElementById("rkField"); if (elField) realisasiState.filterField = elField.value || "";
                let elValue = document.getElementById("rkValue"); if (elValue) realisasiState.filterValue = (elValue.value || "").trim();
            }
            let filtered = realisasiState.data.slice();
            if (realisasiState.startDate) filtered = filtered.filter(x => x.tanggal && x.tanggal >= realisasiState.startDate);
            if (realisasiState.endDate) filtered = filtered.filter(x => x.tanggal && x.tanggal <= realisasiState.endDate);
            if (realisasiState.filterValue) {
                let kw = realisasiState.filterValue.toLowerCase();
                if (realisasiState.filterField) filtered = filtered.filter(x => String(x[realisasiState.filterField] || "").toLowerCase().includes(kw));
                else filtered = filtered.filter(x => Object.values(x).join(" ").toLowerCase().includes(kw));
            }
            realisasiState.filtered = filtered;
            renderRealisasiTable();
        }

        function resetRealisasiFilter() {
            document.getElementById("rkStart").value = ""; document.getElementById("rkEnd").value = "";
            document.getElementById("rkField").value = ""; document.getElementById("rkValue").value = "";
            realisasiState.startDate = ""; realisasiState.endDate = ""; realisasiState.filterField = ""; realisasiState.filterValue = "";
            realisasiState.page = 1; realisasiState.filtered = realisasiState.data.slice();
            renderRealisasiTable();
        }

        function changeRealisasiPageSize(size) { realisasiState.pageSize = Number(size); realisasiState.page = 1; renderRealisasiTable(); }
        function changeRealisasiPage(delta) {
            let totalPages = Math.ceil(realisasiState.filtered.length / realisasiState.pageSize) || 1;
            let newPage = realisasiState.page + delta;
            if (newPage < 1) newPage = 1;
            if (newPage > totalPages) newPage = totalPages;
            realisasiState.page = newPage;
            renderRealisasiTable();
        }

        function renderRealisasiTable() {
            let s = realisasiState;
            let totalData = s.filtered.length;
            let pageSize = s.pageSize;
            let totalPages = Math.ceil(totalData / pageSize) || 1;
            if (s.page > totalPages) s.page = totalPages;
            let startIdx = (s.page - 1) * pageSize;
            let endIdx = Math.min(startIdx + pageSize, totalData);
            let pageData = s.filtered.slice(startIdx, endIdx);
            let tbody = document.getElementById("realisasiTableBody");
            if (!tbody) return;
            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 30px; color: var(--muted);">Tidak ada data pengeluaran tahun ${TAHUN_AKTIF || '-'} yang cocok dengan filter.</td></tr>`;
            } else {
                tbody.innerHTML = pageData.map((x, i) => {
                    let badgeAsal = x.asal.startsWith("Admin") 
                        ? `<span class="badge" style="background:#e1efff; color:#0d6efd;"><i class="fa-solid fa-building-columns"></i> Admin</span>` 
                        : `<span class="badge" style="background:#fff3df; color:#9a6500;"><i class="fa-solid fa-user-tie"></i> ${x.asal.replace("Guru (", "").replace(")", "")}</span>`;
                    let badgeSumber = x.sumber_dana && x.sumber_dana !== "-" ? `<span class="badge badge-success" style="font-size: 10px;">${x.sumber_dana}</span>` : `<span style="color:var(--muted); font-size:11px;">-</span>`;
                    let badgeStatus = x.status === "Disetujui" || x.status === "Tunai" ? `<span class="badge badge-success" style="font-size: 10px;">${x.status}</span>` : `<span class="badge badge-warning" style="font-size: 10px;">${x.status}</span>`;
                    let buktiCell = x.bukti_bayar 
                        ? `<button class="btn btn-light btn-sm" onclick="lihatBukti(${x.id})" style="border: 1px solid #dce3ea;"><i class="fa-solid ${x.bukti_bayar.startsWith('data:application/pdf') ? 'fa-file-pdf' : 'fa-image'}" style="color: var(--primary2);"></i></button>` 
                        : `<span style="color:var(--muted); font-size:11px;">-</span>`;
                    return `<tr>
                        <td style="text-align:center;">${startIdx + i + 1}</td>
                        <td>${formatDate(x.tanggal)}</td>
                        <td style="font-family: monospace; font-size: 12px; color: var(--muted);">${x.nomor}</td>
                        <td>${x.keterangan}</td>
                        <td>${badgeAsal}</td>
                        <td style="text-align:center;">${x.volume}</td>
                        <td style="text-align:right; font-weight:bold; color: var(--danger);">${rupiah(x.jumlah)}</td>
                        <td>${badgeSumber}</td>
                        <td style="text-align:center;">${buktiCell}</td>
                        <td style="text-align:center;">${badgeStatus}</td>
                    </tr>`;
                }).join("");
            }
            let infoEl = document.getElementById("rkPageInfo");
            if (infoEl) infoEl.innerHTML = totalData > 0 ? `Menampilkan <b>${startIdx + 1}-${endIdx}</b> dari <b>${totalData}</b> data` : `0 data`;
            let labelEl = document.getElementById("rkPageLabel");
            if (labelEl) labelEl.innerText = `Hal ${s.page} / ${totalPages}`;
            let prevBtn = document.getElementById("rkPrevBtn"); if (prevBtn) prevBtn.disabled = s.page <= 1;
            let nextBtn = document.getElementById("rkNextBtn"); if (nextBtn) nextBtn.disabled = s.page >= totalPages;
        }

        function formatRupiahInput(elem) {
            let number_string = elem.value.replace(/[^,\d]/g, '').toString();
            let split = number_string.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
            elem.value = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        }

        function hitungSaldoKategoriDanaLokal(excludeId = null) {
            let pendapatan = getView("Pendapatan");
            let pengeluaran = getView("Pengeluaran");
            let pengajuan = getView("Pengajuan");
            let rencanaKeluar = getView("Rencana Pengeluaran");
            let kategoris = getKategoriPendapatanList().map(k => k.nama);
            let saldoMap = {};
            kategoris.forEach(k => { saldoMap[k] = 0; });
            pendapatan.forEach(x => {
                if (x.approval_status && x.approval_status !== "Disetujui") return;
                if (!x.kategori) return;
                if (saldoMap[x.kategori] === undefined) saldoMap[x.kategori] = 0;
                saldoMap[x.kategori] += Number(x.jumlah) || 0;
            });
            pengeluaran.forEach(x => {
                if (x.approval_status !== "Disetujui") return;
                if (!x.sumber_dana) return;
                if (saldoMap[x.sumber_dana] === undefined) saldoMap[x.sumber_dana] = 0;
                saldoMap[x.sumber_dana] -= Number(x.jumlah) || 0;
            });
            pengajuan.forEach(x => {
                if (x.approval_status !== "Disetujui") return;
                if (!x.sumber_dana) return;
                if (saldoMap[x.sumber_dana] === undefined) saldoMap[x.sumber_dana] = 0;
                saldoMap[x.sumber_dana] -= Number(x.total) || 0;
            });
            rencanaKeluar.forEach(x => {
                if (x._from_guru) return;
                if (x.approval_status !== "Disetujui") return;
                if (!x.sumber_dana) return;
                if (excludeId && x.id === excludeId) return;
                if (saldoMap[x.sumber_dana] === undefined) saldoMap[x.sumber_dana] = 0;
                saldoMap[x.sumber_dana] -= Number(x.total) || 0;
            });
            return saldoMap;
        }

        function calcAnggaranTotal() {
            let vol = (document.getElementById('anggaran_volume')?.value || '').replace(/\./g, '');
            let nil = (document.getElementById('anggaran_nilai')?.value || '').replace(/\./g, '');
            let total = Number(vol) * Number(nil);
            document.getElementById('calc_total').value = total ? total.toLocaleString('id-ID') : '';
        }

        function calcPengeluaranTotal() {
            let volInput = document.getElementById('pengeluaran_volume');
            let nilaiInput = document.getElementById('pengeluaran_nilai');
            let totalInput = document.getElementById('pengeluaran_total');
            let infoNilai = document.getElementById('info_nilai');
            if (!volInput || !nilaiInput || !totalInput) return;
            let vol = Number(volInput.value || 0);
            let nilai = Number((nilaiInput.value || '').replace(/\./g, '')) || 0;
            let maxVol = Number(volInput.getAttribute('max') || 0);
            if (maxVol > 0 && vol > maxVol) { toast(`Volume melebihi sisa rencana (${maxVol})!`); volInput.value = maxVol; vol = maxVol; }
            let estimasi = Number(nilaiInput.getAttribute('data-estimasi') || 0);
            if (infoNilai) {
                if (estimasi > 0 && nilai > estimasi) {
                    infoNilai.style.color = 'var(--danger)';
                    infoNilai.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Harga satuan (${rupiah(nilai)}) melebihi estimasi rencana (${rupiah(estimasi)})!`;
                } else {
                    infoNilai.style.color = 'var(--muted)';
                    infoNilai.innerHTML = `Estimasi dari Rencana Anggaran: <b style="color: var(--primary);">${rupiah(estimasi)}</b>. Masukkan harga aktual (tidak boleh melebihi).`;
                }
            }
            totalInput.value = (vol * nilai) ? (vol * nilai).toLocaleString('id-ID') : '';
            validateSaldoSumberDana();
        }
