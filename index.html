<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMKU SD GIM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid fa-school"></i> SIMKU SD GIM</h2>
            <p style="margin-bottom: 20px; color: var(--muted);">Silakan login ke akun Anda</p>
            
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p id="loginError" style="color: red; font-size: 12px; margin-top: 10px; display: none;">Username atau password salah!</p>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        // Cek jika pengguna sudah login sebelumnya
        const existingUser = JSON.parse(localStorage.getItem("currentUser"));
        if (existingUser) {
            window.location.href = existingUser.role === "guru" ? "guru.html" : "dashboard.html";
        }

        document.getElementById("loginForm").onsubmit = function(e) {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const valid = db.Pengguna.find(x => x.username === u && x.password === p);

            if (valid) {
                localStorage.setItem("currentUser", JSON.stringify(valid));
                // Arahkan ke halaman sesuai hak akses / role
                if (valid.role === "guru") {
                    window.location.href = "guru.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        };
    </script>
</body>
</html>
