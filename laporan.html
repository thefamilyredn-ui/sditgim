<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - SIMKU SD GIM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h3 id="topTitle">Laporan</h3>
            </div>
            <div class="user-box">
                <div class="user-text">
                    <strong id="userDisplayName">User</strong><br>
                    <small id="userDisplayRole">Admin</small>
                </div>
            </div>
        </header>

        <section class="content" id="app"></section>
    </main>

    <div class="modal" id="printModal">
        <div class="modal-content" style="max-width: 460px;">
            <div class="modal-header">
                <h3>Filter Cetak Laporan</h3>
                <span class="close" onclick="closePrintModal()">&times;</span>
            </div>
            
            <div class="form-group">
                <label>Dari Tanggal</label>
                <input type="date" id="printStart">
            </div>
            <br>
            <div class="form-group">
                <label>Sampai Tanggal</label>
                <input type="date" id="printEnd">
            </div>
            <br>
            <div class="form-group" id="printActionDateGroup" style="display:none;">
                <label>Tanggal Cetak Dokumen</label>
                <input type="date" id="printActionDate">
            </div>

            <div style="border-top: 1px dashed #e2e8f0; margin-top: 15px; padding-top: 15px;">
                <div style="font-size: 12px; color: var(--muted); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">
                    <i class="fa-solid fa-file"></i> Pengaturan Kertas
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Ukuran Kertas</label>
                        <select id="printPaper">
                            <option value="A4">A4 (210 × 297 mm)</option>
                            <option value="F4">F4 / Folio (215 × 330 mm)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Orientasi</label>
                        <select id="printOrientation">
                            <option value="portrait">Portrait (Tegak)</option>
                            <option value="landscape">Landscape (Mendatar)</option>
                        </select>
                    </div>
                </div>
                <div style="background: #eff6ff; border-left: 3px solid #3b82f6; padding: 10px 12px; border-radius: 6px; margin-top: 12px; font-size: 11.5px; color: #1e40af; line-height: 1.5;">
                    <i class="fa-solid fa-info-circle"></i> 
                    <b>Tips:</b> Untuk laporan dengan banyak kolom, pilih <b>Landscape</b>. 
                    Untuk F4 pastikan printer mendukung ukuran ini.
                </div>
            </div>

            <br>
            <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="processPrint()">
                <i class="fa-solid fa-print"></i> Cetak Sekarang
            </button>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content" style="max-width: 450px; padding: 0; overflow: hidden; border-radius: 12px;">
            <div style="background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 16px;"><i class="fa-solid fa-file-invoice-dollar" style="margin-right:8px;"></i> Rincian Data Transaksi</h3>
                <span class="close" style="color: white; opacity: 0.8; font-size: 24px;" onclick="closeDetailModal()">&times;</span>
            </div>
            <div id="detailContent" style="padding: 25px; background: white;"></div>
            <div style="padding: 15px 25px; background: #f9fafb; border-top: 1px solid var(--border); text-align: right;">
                <button class="btn btn-light" style="border: 1px solid #dce3ea;" onclick="closeDetailModal()">Tutup</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script src="db.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const targetMenu = sessionStorage.getItem("targetMenu") || 'Laba/Rugi';
        renderSidebar(targetMenu);
        
        const user = checkAuth("admin"); 
        document.getElementById("userDisplayName").innerText = user.nama;
        let currentReportType = "";

        /* =====================================================
           YEAR FILTER
        ===================================================== */
        const TAHUN_AKTIF = (db["Tahun Anggaran"] || []).find(x => x.status === "Aktif")?.tahun || null;

        function getItemYear(item) {
            if (!item) return "";
            if (item.tahun) return String(item.tahun);
            if (item.tanggal) return String(item.tanggal).substring(0, 4);
            return "";
        }
        function filterByYear(arr) {
            if (!Array.isArray(arr)) return [];
            if (!TAHUN_AKTIF) return [];
            return arr.filter(x => getItemYear(x) === TAHUN_AKTIF);
        }
        function getPendapatanView() { return filterByYear(db["Pendapatan"] || []); }
        
        // Pengeluaran = Admin (Rencana Pengeluaran) + Guru (Pengajuan approved)
        function getPengeluaranView() {
            let admin = filterByYear(db["Rencana Pengeluaran"] || []).filter(x => !x._from_guru);
            let guru = filterByYear(db["Pengajuan"] || []).filter(x => x.approval_status === "Disetujui");
            
            // Normalisasi format agar konsisten
            let result = [];
            admin.forEach(x => result.push({
                id: x.id,
                _tabel: "Rencana Pengeluaran",
                _sumber: "Admin",
                tanggal: x.tanggal,
                uraian: x.uraian,
                volume: x.volume || 1,
                total: Number(x.total) || 0,
                status: x.status || "Tunai",
                kategori_belanja: x.kategori_belanja || "",
                sumber_dana: x.sumber_dana || "",
                keterangan: x.uraian
            }));
            guru.forEach(x => result.push({
                id: x.id,
                _tabel: "Pengajuan",
                _sumber: "Guru (" + x.nama_guru + ")",
                tanggal: x.tanggal,
                uraian: (x.kegiatan || "") + (x.uraian_anggaran ? " — " + x.uraian_anggaran : ""),
                volume: x.volume || 1,
                total: Number(x.total) || 0,
                status: x.status || "Tunai",
                kategori_belanja: x.kategori || "",
                sumber_dana: x.sumber_dana || "",
                keterangan: x.kegiatan || ""
            }));
            return result;
        }
        
        function getPemindahanView() { return filterByYear(db["Pemindahan Kas"] || []); }

        /* =====================================================
           STATE
        ===================================================== */
        let lrState = {
            pendapatan:   { page: 1, pageSize: 10, filterField: "", filterValue: "" },
            pemindahan:   { page: 1, pageSize: 10, filterField: "", filterValue: "" },
            pengeluaran:  { page: 1, pageSize: 10, filterField: "", filterValue: "" },
            startDate: null,
            endDate: null
        };

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('show')) sidebar.classList.remove('show');
        }

        function formatTanggalIndo(dateStr) {
            if(!dateStr) return "-";
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const d = new Date(dateStr);
            return `${d.getDate().toString().padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function goToMasterTahun() {
            sessionStorage.setItem("targetMenu", "Tahun Anggaran");
            window.location.href = "master.html";
        }

        function yearBannerHtml() {
            return `
            <div class="year-banner">
                <div>
                    <div class="yb-label">Periode Laporan Aktif</div>
                    <div class="yb-value">Tahun Anggaran ${TAHUN_AKTIF}</div>
                </div>
                <div class="yb-icon"><i class="fa-solid fa-calendar-check"></i></div>
            </div>`;
        }

        /* =====================================================
           HITUNG SEMUA ANGKA + BREAKDOWN TUNAI/TRANSFER
        ===================================================== */
        function hitungAngkaLaporan(startDate, endDate) {
            let pendapatanList = getPendapatanView();
            let pengeluaranList = getPengeluaranView();
            let pemindahanList = getPemindahanView();

            if (startDate && endDate) {
                pendapatanList = pendapatanList.filter(x => x.tanggal >= startDate && x.tanggal <= endDate);
                pengeluaranList = pengeluaranList.filter(x => x.tanggal >= startDate && x.tanggal <= endDate);
                pemindahanList = pemindahanList.filter(x => x.tanggal >= startDate && x.tanggal <= endDate);
            }

            // Pendapatan
            let pendTunai = pendapatanList.filter(x => (x.status || "Tunai").toLowerCase() === "tunai").reduce((s,x) => s + (Number(x.jumlah)||0), 0);
            let pendTransfer = pendapatanList.filter(x => (x.status || "").toLowerCase() === "transfer").reduce((s,x) => s + (Number(x.jumlah)||0), 0);
            let totalPend = pendTunai + pendTransfer;

            // Pengeluaran (admin + guru)
            let pengTunai = pengeluaranList.filter(x => (x.status || "Tunai").toLowerCase() === "tunai").reduce((s,x) => s + (Number(x.total)||0), 0);
            let pengTransfer = pengeluaranList.filter(x => (x.status || "").toLowerCase() === "transfer").reduce((s,x) => s + (Number(x.total)||0), 0);
            let totalPeng = pengTunai + pengTransfer;
            
            let pengAdmin = pengeluaranList.filter(x => x._sumber === "Admin").reduce((s,x) => s + (Number(x.total)||0), 0);
            let pengGuru = pengeluaranList.filter(x => x._sumber !== "Admin").reduce((s,x) => s + (Number(x.total)||0), 0);

            // Pemindahan netto
            let pindahKeTunai = 0, pindahKeTransfer = 0;
            pemindahanList.forEach(x => {
                let jml = Number(x.jumlah) || 0;
                if (x.dari === "Transfer" && x.ke === "Tunai") pindahKeTunai += jml;
                else if (x.dari === "Tunai" && x.ke === "Transfer") pindahKeTransfer += jml;
            });

            // Saldo akhir per metode (setelah pemindahan)
            let saldoAkhirTunai = pendTunai - pengTunai - pindahKeTransfer + pindahKeTunai;
            let saldoAkhirTransfer = pendTransfer - pengTransfer + pindahKeTransfer - pindahKeTunai;

            let totalPemindahan = pemindahanList.reduce((s,x) => s + (Number(x.jumlah)||0), 0);
            let surplus = totalPend - totalPeng;

            return {
                pendapatanList, pengeluaranList, pemindahanList,
                pendTunai, pendTransfer, totalPend,
                pengTunai, pengTransfer, totalPeng,
                pengAdmin, pengGuru,
                saldoAkhirTunai, saldoAkhirTransfer,
                totalPemindahan,
                surplus
            };
        }

        /* =====================================================
           FILTER & PAGINATION PER TABEL
        ===================================================== */
        function getFilteredList(key, list) {
            let s = lrState[key];
            let result = list.slice();
            if (s.filterValue) {
                let kw = s.filterValue.toLowerCase();
                if (s.filterField) {
                    result = result.filter(x => String(x[s.filterField] || "").toLowerCase().includes(kw));
                } else {
                    result = result.filter(x => Object.values(x).join(" ").toLowerCase().includes(kw));
                }
            }
            return result;
        }

        function getPaginated(key, list) {
            let s = lrState[key];
            let totalData = list.length;
            let pageSize = s.pageSize;
            let totalPages = Math.ceil(totalData / pageSize) || 1;
            if (s.page > totalPages) s.page = totalPages;
            let startIdx = (s.page - 1) * pageSize;
            let endIdx = Math.min(startIdx + pageSize, totalData);
            return {
                totalData, pageSize, totalPages,
                startIdx, endIdx,
                pageData: list.slice(startIdx, endIdx),
                currentPage: s.page
            };
        }

        function paginationFooterHtml(key, meta, countLabel = "data") {
            return `
            <div class="pagination-bar" style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);">
                <div>${meta.totalData > 0 ? `Menampilkan <strong>${meta.startIdx + 1}-${meta.endIdx}</strong> dari <strong>${meta.totalData}</strong> ${countLabel}` : '0 data'}</div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <button class="btn btn-light btn-sm" onclick="changeLRPage('${key}', ${meta.currentPage - 1})" ${meta.currentPage <= 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <span style="font-weight: bold; color: var(--text); padding: 0 4px;">Hal ${meta.currentPage} / ${meta.totalPages}</span>
                    <button class="btn btn-light btn-sm" onclick="changeLRPage('${key}', ${meta.currentPage + 1})" ${meta.currentPage >= meta.totalPages ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>`;
        }

        function changeLRPage(key, newPage) {
            if (newPage < 1) return;
            let total = 0;
            if (key === "pendapatan") total = getFilteredList(key, getPendapatanView()).length;
            else if (key === "pengeluaran") total = getFilteredList(key, getPengeluaranView()).length;
            else if (key === "pemindahan") total = getFilteredList(key, getPemindahanView()).length;
            let totalPages = Math.ceil(total / lrState[key].pageSize) || 1;
            if (newPage > totalPages) newPage = totalPages;
            lrState[key].page = newPage;
            renderLabaRugi(lrState.startDate, lrState.endDate);
        }

        function changeLRPageSize(key, newSize) {
            lrState[key].pageSize = Number(newSize);
            lrState[key].page = 1;
            renderLabaRugi(lrState.startDate, lrState.endDate);
        }

        function applyLRFilter(key) {
            let fieldEl = document.getElementById(`${key}_field`);
            let valueEl = document.getElementById(`${key}_value`);
            lrState[key].filterField = fieldEl ? fieldEl.value : "";
            lrState[key].filterValue = valueEl ? valueEl.value.trim() : "";
            lrState[key].page = 1;
            renderLabaRugi(lrState.startDate, lrState.endDate);
        }

        function resetLRFilter(key) {
            let fieldEl = document.getElementById(`${key}_field`);
            let valueEl = document.getElementById(`${key}_value`);
            if (fieldEl) fieldEl.value = "";
            if (valueEl) valueEl.value = "";
            lrState[key].filterField = "";
            lrState[key].filterValue = "";
            lrState[key].page = 1;
            renderLabaRugi(lrState.startDate, lrState.endDate);
        }

        function applyFilterLR() {
            lrState.startDate = document.getElementById('lrStart').value || null;
            lrState.endDate = document.getElementById('lrEnd').value || null;
            lrState.pendapatan.page = 1;
            lrState.pemindahan.page = 1;
            lrState.pengeluaran.page = 1;
            renderLabaRugi(lrState.startDate, lrState.endDate);
        }

        function resetGlobalFilterLR() {
            lrState.startDate = null;
            lrState.endDate = null;
            lrState.pendapatan.page = 1;
            lrState.pemindahan.page = 1;
            lrState.pengeluaran.page = 1;
            renderLabaRugi();
        }

        /* =====================================================
           HAPUS & DETAIL
        ===================================================== */
        function deleteLRData(tabel, id) {
            Swal.fire({
                title: 'Hapus Data Transaksi',
                text: "Data yang sudah dihapus tidak dapat dikembalikan",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="fa-solid fa-trash"></i> Ya',
                cancelButtonText: 'Batal',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    db[tabel] = db[tabel].filter(x => x.id !== id);
                    saveDB();
                    renderLabaRugi(lrState.startDate, lrState.endDate); 
                    Swal.fire({ title: 'Terhapus!', text: 'Data berhasil dihapus.', icon: 'success', timer: 1500, showConfirmButton: false });
                }
            });
        }

        function closeDetailModal() { document.getElementById("detailModal").classList.remove("show"); }

        function detailLRData(tabel, id) {
            let data = db[tabel].find(x => x.id === id);
            if(!data) return;
            
            let statusBadge = data.status === 'Tunai' ? '<span class="badge badge-success">Tunai</span>' : '<span class="badge badge-warning">Transfer</span>';
            
            let html = `<table class="custom-detail-table">
                <tr><td>Tanggal</td><td><strong style="color:var(--text);">${formatTanggalIndo(data.tanggal)}</strong></td></tr>
                <tr><td>Status</td><td>${statusBadge}</td></tr>`;
            
            if(tabel === "Pendapatan") {
                html += `
                <tr><td>Kategori</td><td><strong style="color:var(--text);">${data.kategori || '-'}</strong></td></tr>
                <tr><td>Keterangan</td><td><strong style="color:var(--text);">${data.keterangan || '-'}</strong></td></tr>
                <tr><td>Total Nominal</td><td><strong style="color:var(--success); font-size:18px;">${rupiah(data.jumlah)}</strong></td></tr>`;
            } else {
                html += `
                <tr><td>Uraian Pengeluaran</td><td><strong style="color:var(--text);">${data.uraian || data.kegiatan || '-'}</strong></td></tr>
                <tr><td>Volume (Qty)</td><td><strong style="color:var(--text);">${data.volume || 1}</strong></td></tr>
                <tr><td>Total Nominal</td><td><strong style="color:var(--danger); font-size:18px;">${rupiah(data.total)}</strong></td></tr>`;
            }
            html += `</table>`;
            
            document.getElementById("detailContent").innerHTML = html;
            document.getElementById("detailModal").classList.add("show");
        }

        /* =====================================================
           EXPORT EXCEL
        ===================================================== */
        function exportExcelLR() {
            let dataPendapatan = getPendapatanView();
            let dataPengeluaran = getPengeluaranView(); 
            let dataPemindahan = getPemindahanView();

            if(lrState.startDate && lrState.endDate) {
                dataPendapatan = dataPendapatan.filter(x => x.tanggal >= lrState.startDate && x.tanggal <= lrState.endDate);
                dataPengeluaran = dataPengeluaran.filter(x => x.tanggal >= lrState.startDate && x.tanggal <= lrState.endDate);
                dataPemindahan = dataPemindahan.filter(x => x.tanggal >= lrState.startDate && x.tanggal <= lrState.endDate);
            }

            if (dataPendapatan.length === 0 && dataPengeluaran.length === 0 && dataPemindahan.length === 0) { 
                toast("Tidak ada data untuk di-export!"); return; 
            }

            const wb = XLSX.utils.book_new();

            let excelPend = dataPendapatan.map((x, idx) => ({
                "No": idx + 1, "Tanggal": formatDate(x.tanggal), "Kategori": x.kategori || "-",
                "Keterangan": x.keterangan || "-", "Nominal": Number(x.jumlah) || 0, "Status": x.status || "Tunai"
            }));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(excelPend), "Pendapatan");

            let excelPindah = dataPemindahan.map((x, idx) => ({
                "No": idx + 1, "Tanggal": formatDate(x.tanggal), "Kategori": x.kategori || "-",
                "Dari": x.dari, "Ke": x.ke, "Jumlah": Number(x.jumlah) || 0, "Keterangan": x.keterangan || "-"
            }));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(excelPindah), "Pemindahan Kas");

            let excelPeng = dataPengeluaran.map((x, idx) => ({
                "No": idx + 1, "Tanggal": formatDate(x.tanggal), "Sumber": x._sumber,
                "Uraian": x.uraian || "-", "Volume": x.volume || 1, 
                "Total Pengeluaran": Number(x.total) || 0, "Status": x.status || "Tunai"
            }));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(excelPeng), "Pengeluaran");

            XLSX.writeFile(wb, `Laporan_Laba_Rugi_${TAHUN_AKTIF}.xlsx`);
            toast("Laporan Excel berhasil diunduh");
        }

        /* =====================================================
           CETAK
        ===================================================== */
        function openPrintModal(type) {
            currentReportType = type;
            document.getElementById("printModal").classList.add("show");
            if(type === "Buku Kas Umum") {
                document.getElementById("printActionDateGroup").style.display = "block";
                document.getElementById("printActionDate").value = new Date().toISOString().split("T")[0];
            } else {
                document.getElementById("printActionDateGroup").style.display = "none";
            }
        }
        function closePrintModal() { document.getElementById("printModal").classList.remove("show"); }

        function injectPrintStyle(paper, orientation) {
            let sizes = {
                'A4': { w: 210, h: 297 },
                'F4': { w: 215, h: 330 }
            };
            let s = sizes[paper] || sizes['A4'];
            let width = orientation === 'landscape' ? s.h : s.w;
            let height = orientation === 'landscape' ? s.w : s.h;
            
            let existing = document.getElementById('dynamicPrintStyle');
            if (existing) existing.remove();
            
            let style = document.createElement('style');
            style.id = 'dynamicPrintStyle';
            style.textContent = `
                @media print {
                    @page {
                        size: ${width}mm ${height}mm;
                        margin: 15mm 10mm 15mm 10mm;
                    }
                }
            `;
            document.head.appendChild(style);
        }

        function processPrint() {
            let start = document.getElementById("printStart").value;
            let end = document.getElementById("printEnd").value;
            let pDate = document.getElementById("printActionDate").value;
            let paper = document.getElementById("printPaper").value || "A4";
            let orientation = document.getElementById("printOrientation").value || "portrait";
            
            injectPrintStyle(paper, orientation);
            closePrintModal();

            if (currentReportType === "Laba/Rugi") {
                lrState.startDate = start || null;
                lrState.endDate = end || null;
                renderLabaRugi(start, end);
            }
            else if (currentReportType === "Buku Kas Umum") renderBKU(start, end, pDate);
            
            setTimeout(() => { window.print(); }, 600);
        }

        /* =====================================================
           ROUTER
        ===================================================== */
        function openReport(type) {
            closeMobileSidebar();
            document.getElementById("topTitle").innerText = "Laporan " + type;
            if (type === "Laba/Rugi") renderLabaRugi();
            else if (type === "Arus Kas") renderArusKas();
            else if (type === "Buku Kas Umum") renderBKU();
        }

        /* =====================================================
           RENDER LABA RUGI
        ===================================================== */
        function renderLabaRugi(startDate = lrState.startDate, endDate = lrState.endDate) {
            let pSekolah = db.profile || { nama: "SD GIM BEKASI" };

            let data = hitungAngkaLaporan(startDate, endDate);
            let { pendapatanList, pengeluaranList, pemindahanList,
                  pendTunai, pendTransfer, totalPend,
                  pengTunai, pengTransfer, totalPeng,
                  pengAdmin, pengGuru,
                  saldoAkhirTunai, saldoAkhirTransfer, surplus } = data;

                            ? `<tr><td colspan="7" style="text-align:center; padding:15px;">Tidak ada data pengeluaran</td></tr>` 
                            : pengeluaranList.map((x, i) => `
                                <tr>
                                    <td style="text-align:center;">${i + 1}</td>
                                    <td>${formatDate(x.tanggal)}</td>
                                    <td>${x.uraian || '-'}</td>
                                    <td style="text-align:center; font-size:9pt;">${x._sumber}</td>
                                    <td style="text-align:center;">${x.volume || 1}</td>
                                    <td style="text-align:center;">${x.status || '-'}</td>
                                    <td style="text-align:right;">${rupiah(x.total)}</td>
                                </tr>
                            `).join('')}
                        <tr>
                            <td colspan="6" style="text-align:right; font-weight:bold;">Total Pengeluaran</td>
                            <td style="text-align:right; font-weight:bold;">${rupiah(totalPeng)}</td>
                        </tr>
                    </tbody>
                </table>

                <div class="print-surplus-box">
                    <span>SURPLUS / DEFISIT (LABA BERSIH):</span>
                    <span>${rupiah(surplus)}</span>
                </div>

                <div class="signature-section">
                    <div class="signature-box">
                        <p>Mengetahui,</p>
                        <p>KEPALA SEKOLAH</p>
                        <div class="signature-space"></div>
                        <p>${pSekolah.kepala || '........................'}</p>
                    </div>
                    <div class="signature-box">
                        <p>Kota Bekasi, ${formatTanggalIndo(new Date().toISOString().split('T')[0])}</p>
                        <p>BENDAHARA</p>
                        <div class="signature-space"></div>
                        <p>${pSekolah.bendahara || '........................'}</p>
                    </div>
                </div>
            </div>
            `;
        }

        /* =====================================================
           RENDER BKU
        ===================================================== */
        function renderBKU(startDate = null, endDate = null, printDate = null) {
            let pSekolah = db.profile || { nama: "SD GIM BEKASI", kepala: "Kepala Sekolah", bendahara: "Bendahara" };

            let pendapatan = getPendapatanView().map(x => ({
                tanggal: x.tanggal, kode: "PEN-" + x.id.toString().slice(-4), uraian: x.keterangan || x.kategori,
                penerimaan: Number(x.jumlah) || 0, pengeluaran: 0, status: x.status || "Tunai"
            }));
            
            let pengeluaran = getPengeluaranView().map(x => ({
                tanggal: x.tanggal, kode: (x._sumber === "Admin" ? "PGL-" : "AJU-") + x.id.toString().slice(-4), 
                uraian: x.uraian + (x._sumber !== "Admin" ? ` [${x._sumber}]` : ""),
                penerimaan: 0, pengeluaran: Number(x.total) || 0, status: x.status || "Tunai"
            }));
            
            let pemindahanRows = [];
            getPemindahanView().forEach(x => {
                let jml = Number(x.jumlah) || 0;
                if (x.dari === "Transfer" && x.ke === "Tunai") {
                    pemindahanRows.push({ tanggal: x.tanggal, kode: "PND-" + x.id.toString().slice(-4), uraian: `[Pindah] ${x.kategori} — Transfer ke Tunai${x.keterangan ? ' ('+x.keterangan+')' : ''}`, penerimaan: jml, pengeluaran: 0, status: "Tunai" });
                    pemindahanRows.push({ tanggal: x.tanggal, kode: "PND-" + x.id.toString().slice(-4), uraian: `[Pindah] ${x.kategori} — Transfer ke Tunai${x.keterangan ? ' ('+x.keterangan+')' : ''}`, penerimaan: 0, pengeluaran: jml, status: "Transfer" });
                } else if (x.dari === "Tunai" && x.ke === "Transfer") {
                    pemindahanRows.push({ tanggal: x.tanggal, kode: "PND-" + x.id.toString().slice(-4), uraian: `[Pindah] ${x.kategori} — Tunai ke Transfer${x.keterangan ? ' ('+x.keterangan+')' : ''}`, penerimaan: 0, pengeluaran: jml, status: "Tunai" });
                    pemindahanRows.push({ tanggal: x.tanggal, kode: "PND-" + x.id.toString().slice(-4), uraian: `[Pindah] ${x.kategori} — Tunai ke Transfer${x.keterangan ? ' ('+x.keterangan+')' : ''}`, penerimaan: jml, pengeluaran: 0, status: "Transfer" });
                }
            });

            let bkuData = [...pendapatan, ...pengeluaran, ...pemindahanRows];
            bkuData.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

            let penerimaanLalu = 0, pengeluaranLalu = 0, penerimaanIni = 0, pengeluaranIni = 0;
            let saldoTunai = 0, saldoBank = 0, saldoBerjalan = 0;
            let displayData = [];

            bkuData.forEach(row => {
                if(row.status === "Tunai") { saldoTunai += row.penerimaan; saldoTunai -= row.pengeluaran; } 
                else { saldoBank += row.penerimaan; saldoBank -= row.pengeluaran; }

                if (startDate && row.tanggal < startDate) {
                    penerimaanLalu += row.penerimaan; pengeluaranLalu += row.pengeluaran;
                    saldoBerjalan = penerimaanLalu - pengeluaranLalu;
                } else if ((!startDate || row.tanggal >= startDate) && (!endDate || row.tanggal <= endDate)) {
                    penerimaanIni += row.penerimaan; pengeluaranIni += row.pengeluaran;
                    saldoBerjalan += row.penerimaan; saldoBerjalan -= row.pengeluaran;
                    row.saldo = saldoBerjalan;
                    displayData.push(row);
                }
            });

            let totalSemuaPenerimaan = penerimaanLalu + penerimaanIni;
            let totalSemuaPengeluaran = pengeluaranLalu + pengeluaranIni;
            let sisaKasAkhir = totalSemuaPenerimaan - totalSemuaPengeluaran;

            let filterText = (startDate && endDate) ? `Periode ${formatTanggalIndo(startDate)} s/d ${formatTanggalIndo(endDate)}` : `Tahun Anggaran ${TAHUN_AKTIF}`;
            let tglCetak = printDate ? formatTanggalIndo(printDate) : formatTanggalIndo(new Date().toISOString().split("T")[0]);

            document.getElementById("app").innerHTML=`
            <div class="page-header">
                <div><h1>Buku Kas Umum (BKU)</h1><p>Catatan kronologis penerimaan dan pengeluaran tahun ${TAHUN_AKTIF}</p></div>
                <button class="btn btn-primary" onclick="openPrintModal('Buku Kas Umum')"><i class="fa-solid fa-print"></i> Cetak</button>
            </div>

            ${yearBannerHtml()}
            
            <div class="box">
                <div class="report-header print-only-block">
                    <h2>${pSekolah.nama}</h2>
                    <p style="font-weight: bold;">BUKU KAS UMUM</p>
                    <p style="color: var(--muted); font-size: 13px;">${filterText}</p>
                </div>
                
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left;">Tanggal</th>
                                <th style="text-align:left;">No. Bukti</th>
                                <th style="text-align:left;">Uraian</th>
                                <th style="text-align:right;">Penerimaan</th>
                                <th style="text-align:right;">Pengeluaran</th>
                                <th style="text-align:right;">Saldo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${displayData.length === 0 ? `<tr><td colspan="6" style="text-align:center;">Tidak ada data pada periode ini.</td></tr>` : ''}
                            ${displayData.map(x => `
                                <tr>
                                    <td>${formatDate(x.tanggal)}</td>
                                    <td>${x.kode || '-'}</td>
                                    <td>${x.uraian}</td>
                                    <td style="text-align:right;">${x.penerimaan > 0 ? rupiah(x.penerimaan) : ''}</td>
                                    <td style="text-align:right;">${x.pengeluaran > 0 ? rupiah(x.pengeluaran) : ''}</td>
                                    <td style="text-align:right;">${rupiah(x.saldo)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                        
                        <tbody class="print-only-table print-footer-table">
                            <tr>
                                <td colspan="3" style="text-align:left;">Jumlah periode ini</td>
                                <td style="text-align:right;">${rupiah(penerimaanIni)}</td>
                                <td style="text-align:right;">${rupiah(pengeluaranIni)}</td>
                                <td style="text-align:right;"></td>
                            </tr>
                            <tr>
                                <td colspan="3" style="text-align:left;">Jumlah sampai periode lalu</td>
                                <td style="text-align:right;">${rupiah(penerimaanLalu)}</td>
                                <td style="text-align:right;">${rupiah(pengeluaranLalu)}</td>
                                <td style="text-align:right;"></td>
                            </tr>
                            <tr>
                                <td colspan="3" style="text-align:left;">Jumlah semua sampai periode ini</td>
                                <td style="text-align:right;">${rupiah(totalSemuaPenerimaan)}</td>
                                <td style="text-align:right;">${rupiah(totalSemuaPengeluaran)}</td>
                                <td style="text-align:right;"></td>
                            </tr>
                            <tr>
                                <td colspan="5" style="text-align:left;">Sisa Kas</td>
                                <td style="text-align:right;">${rupiah(sisaKasAkhir)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="saldo-rincian print-only-block">
                    Terdiri dari:<br>
                    a. Tunai &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rp. ${rupiah(saldoTunai)}<br>
                    b. Bank &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rp. ${rupiah(saldoBank)}
                </div>

                <div class="signature-section print-only-flex">
                    <div class="signature-box">
                        <p>Mengetahui,</p>
                        <p>KEPALA SEKOLAH</p>
                        <div class="signature-space"></div>
                        <p style="font-weight: bold; text-decoration: underline;">${pSekolah.kepala}</p>
                    </div>
                    <div class="signature-box right">
                        <p>Kota Bekasi, ${tglCetak}</p>
                        <p>BENDAHARA</p>
                        <div class="signature-space"></div>
                        <p style="font-weight: bold; text-decoration: underline;">${pSekolah.bendahara}</p>
                    </div>
                </div>
            </div>`;
        }

        /* =====================================================
           RENDER ARUS KAS
        ===================================================== */
        function renderArusKas() {
            let data = hitungAngkaLaporan(lrState.startDate, lrState.endDate);
            let { totalPend, totalPeng, surplus, saldoAkhirTunai, saldoAkhirTransfer, pengAdmin, pengGuru } = data;

            document.getElementById("app").innerHTML=`
            <div class="page-header">
                <div><h1>Laporan Arus Kas</h1><p>Visualisasi pergerakan kas masuk dan keluar tahun ${TAHUN_AKTIF}</p></div>
            </div>

            ${yearBannerHtml()}

            <div class="lr-summary-grid">
                <div class="lr-summary-card income">
                    <div class="lsc-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div class="lsc-label">Total Kas Masuk</div>
                    <div class="lsc-value">${rupiah(totalPend)}</div>
                    <div class="lsc-breakdown">
                        <div class="lsc-bd-item tunai">
                            <div class="lsc-bd-label"><i class="fa-solid fa-money-bill-wave"></i> Tunai</div>
                            <div class="lsc-bd-value">${rupiah(data.pendTunai)}</div>
                        </div>
                        <div class="lsc-bd-item transfer">
                            <div class="lsc-bd-label"><i class="fa-solid fa-building-columns"></i> Transfer</div>
                            <div class="lsc-bd-value">${rupiah(data.pendTransfer)}</div>
                        </div>
                    </div>
                </div>
                <div class="lr-summary-card expense">
                    <div class="lsc-icon"><i class="fa-solid fa-arrow-trend-down"></i></div>
                    <div class="lsc-label">Total Kas Keluar</div>
                    <div class="lsc-value">${rupiah(totalPeng)}</div>
                    <div class="lsc-breakdown">
                        <div class="lsc-bd-item tunai">
                            <div class="lsc-bd-label"><i class="fa-solid fa-money-bill-wave"></i> Tunai</div>
                            <div class="lsc-bd-value">${rupiah(data.pengTunai)}</div>
                        </div>
                        <div class="lsc-bd-item transfer">
                            <div class="lsc-bd-label"><i class="fa-solid fa-building-columns"></i> Transfer</div>
                            <div class="lsc-bd-value">${rupiah(data.pengTransfer)}</div>
                        </div>
                    </div>
                    <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #e2e8f0; font-size:11px; color:var(--muted); display:flex; justify-content:space-between;">
                        <span>Admin: <b>${rupiah(pengAdmin)}</b></span>
                        <span>Guru: <b>${rupiah(pengGuru)}</b></span>
                    </div>
                </div>
                <div class="lr-summary-card surplus ${surplus < 0 ? 'negative' : ''}">
                    <div class="lsc-icon"><i class="fa-solid fa-${surplus >= 0 ? 'scale-balanced' : 'triangle-exclamation'}"></i></div>
                    <div class="lsc-label">Arus Kas Bersih</div>
                    <div class="lsc-value">${rupiah(surplus)}</div>
                    <div class="lsc-breakdown">
                        <div class="lsc-bd-item tunai">
                            <div class="lsc-bd-label"><i class="fa-solid fa-money-bill-wave"></i> Saldo Tunai</div>
                            <div class="lsc-bd-value">${rupiah(saldoAkhirTunai)}</div>
                        </div>
                        <div class="lsc-bd-item transfer">
                            <div class="lsc-bd-label"><i class="fa-solid fa-building-columns"></i> Saldo Transfer</div>
                            <div class="lsc-bd-value">${rupiah(saldoAkhirTransfer)}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box" style="padding: 30px;">
                <canvas id="cashChart" style="max-height: 400px;"></canvas>
            </div>
            `;

            setTimeout(() => {
                const ctx = document.getElementById("cashChart");
                if(ctx) {
                    new Chart(ctx, {
                        type: "bar",
                        data: {
                            labels: ["Kas Masuk", "Kas Keluar", "Arus Kas Bersih"],
                            datasets: [{
                                label: "Pergerakan Kas",
                                data: [totalPend, totalPeng, surplus],
                                backgroundColor: ["#198754", "#dc3545", "#1d5d9b"],
                                borderRadius: 8
                            }]
                        },
                        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
                    });
                }
            }, 100);
        }

        /* =====================================================
           INIT
        ===================================================== */
        (function initLaporanPage() {
            if (!TAHUN_AKTIF) {
                document.getElementById("app").innerHTML = `
                <div class="page-header">
                    <div><h1>Tahun Anggaran Belum Aktif</h1></div>
                </div>
                <div class="box" style="text-align:center; padding: 50px;">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 64px; color: var(--warning); display: block; margin-bottom: 20px;"></i>
                    <h2 style="color: var(--primary); margin-bottom: 12px;">Tidak Ada Tahun Anggaran Aktif</h2>
                    <p style="color: var(--muted); max-width: 500px; margin: 0 auto 20px;">
                        Silakan aktifkan salah satu tahun anggaran di menu <b>Master Data → Tahun Anggaran</b> terlebih dahulu.
                    </p>
                    <button class="btn btn-primary" onclick="goToMasterTahun()">
                        <i class="fa-solid fa-arrow-right"></i> Buka Pengaturan Tahun Anggaran
                    </button>
                </div>`;
                sessionStorage.removeItem("targetMenu");
                return;
            }

            const target = sessionStorage.getItem("targetMenu");
            if(target === "Arus Kas") openReport("Arus Kas");
            else if (target === "Buku Kas Umum") openReport("Buku Kas Umum");
            else openReport("Laba/Rugi");
            sessionStorage.removeItem("targetMenu"); 
        })();
    </script>
</body>
</html>
