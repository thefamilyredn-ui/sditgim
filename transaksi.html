<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi - SIMKU SD GIM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Library SweetAlert2 untuk Popup -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- ================= SIDEBAR UNIVERSAL ================= -->
    <aside class="sidebar" id="sidebar">
        
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h3 id="topTitle">Transaksi</h3>
            </div>
            <div class="user-box">
                <div class="user-text">
                    <strong id="userDisplayName">User</strong><br>
                    <small id="userDisplayRole">Admin</small>
                </div>
            </div>
        </header>

        <section class="content" id="app"></section>
    </main>

    <!-- ================= MODAL & TOAST ================= -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Transaksi</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="dataForm"></form>
        </div>
    </div>
        <!-- Modal Kelola Kategori Pendapatan -->
    <div class="modal" id="modalKategori">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <div>
                    <h3>Kelola Kategori Pendapatan</h3>
                    <p style="font-size:12px; color:var(--muted); margin-top:5px;">Tambahkan kategori baru atau ubah nama kategori existing</p>
                </div>
                <span class="close" onclick="closeKategoriModal()">&times;</span>
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="newKategoriName" placeholder="Nama kategori baru..." style="flex: 1; padding: 11px; border: 1px solid #dce3ea; border-radius: 8px;">
                <button class="btn btn-primary" onclick="tambahKategoriPendapatan()"><i class="fa-solid fa-plus"></i> Tambah</button>
            </div>

            <div id="kategoriListContainer" style="max-height: 380px; overflow-y: auto;"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="db.js"></script>
    <script src="sidebar.js"></script>
    <script>
        const targetMenu = sessionStorage.getItem("targetMenu") || 'Pendapatan';
        renderSidebar(targetMenu);

        const user = checkAuth("admin");
        document.getElementById("userDisplayName").innerText = user.nama;

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('show')) sidebar.classList.remove('show');
        }

        function closeModal() { document.getElementById("modal").classList.remove("show"); }

        function badge(status) {
            let cls = "badge-info"; 
            if (status === "Tunai" || status === "Aktif") cls = "badge-success";
            else if (status === "Transfer" || status === "Menunggu") cls = "badge-warning";
            else if (status === "Ditolak" || status === "Tidak Aktif") cls = "badge-danger"; 
            return `<span class="badge ${cls}">${status || "-"}</span>`;
        }

               /* =====================================================
           TAMPILAN TABEL TRANSAKSI & RINGKASAN SALDO
        ===================================================== */
        function openTable(name){
            closeMobileSidebar();
            document.getElementById("topTitle").innerText = "Transaksi " + name;
            const data = db[name] || [];
            let columns = getDefaultFields(name);

            // 1. FILTER: Abaikan data lama yang statusnya Ditolak atau Menunggu
            let pendValid = (db["Pendapatan"] || []).filter(x => x.status !== "Ditolak" && x.status !== "Menunggu");
            let pengValid = (db["Pengeluaran"] || []).filter(x => x.status !== "Ditolak" && x.status !== "Menunggu");
            let transValid = (db["Transfer Kas/Rekening"] || []).filter(x => x.status !== "Ditolak" && x.status !== "Menunggu");

            let totalPend = total(pendValid);
            let totalPeng = total(pengValid);
            let totalTrans = total(transValid);
            
            let saldo = totalPend - totalPeng;
            let saldoTransfer = totalPend - totalTrans;
            
            // 2. Tombol Aksi
            let btnHtml = "";
            if ((name === "Pengeluaran" || name === "Transfer Kas/Rekening") && totalPend === 0) {
                btnHtml = `<button class="btn" style="background: var(--muted); color: white; cursor: not-allowed;" onclick="toast('Pastikan data pendapatan sudah terisi terlebih dahulu')"><i class="fa-solid fa-lock"></i> Tambah Transaksi</button>`;
            } else {
                btnHtml = `<button class="btn btn-primary" onclick="openForm('${name}')"><i class="fa-solid fa-plus"></i> Tambah Transaksi</button>`;
            }

            // 3. Tambahan tombol khusus Pendapatan: Kelola Kategori
            let extraBtn = "";
            if (name === "Pendapatan") {
                extraBtn = `<button class="btn btn-light" style="border: 1px solid #dce3ea;" onclick="openKategoriModal()"><i class="fa-solid fa-tags" style="color: var(--primary2);"></i> Kelola Kategori</button>`;
            }

            // 4. Summary untuk toolbar (bukan Pendapatan)
            let summaryHtml = "";
            if (name === "Pengeluaran") {
                summaryHtml = `
                <div style="display: flex; gap: 15px; align-items: center; text-align: right; font-size: 13px; flex-wrap: wrap; justify-content: flex-end;">
                    <div><span style="color: var(--muted);">Pendapatan:</span> <strong style="color: var(--success);">${rupiah(totalPend)}</strong></div>
                    <div><span style="color: var(--muted);">Pengeluaran:</span> <strong style="color: var(--danger);">${rupiah(totalPeng)}</strong></div>
                    <div style="padding-left: 15px; border-left: 2px solid var(--border);">
                        <span style="color: var(--primary); font-weight: bold;">Saldo:</span> 
                        <strong style="font-size: 15px; color: var(--primary);">${rupiah(saldo)}</strong>
                    </div>
                </div>`;
            } else if (name === "Transfer Kas/Rekening") {
                summaryHtml = `
                <div style="display: flex; gap: 15px; align-items: center; text-align: right; font-size: 13px; flex-wrap: wrap; justify-content: flex-end;">
                    <div><span style="color: var(--muted);">Pendapatan:</span> <strong style="color: var(--success);">${rupiah(totalPend)}</strong></div>
                    <div><span style="color: var(--muted);">Transfer:</span> <strong style="color: var(--warning);">${rupiah(totalTrans)}</strong></div>
                    <div style="padding-left: 15px; border-left: 2px solid var(--border);">
                        <span style="color: var(--primary); font-weight: bold;">Saldo:</span> 
                        <strong style="font-size: 15px; color: var(--primary);">${rupiah(saldoTransfer)}</strong>
                    </div>
                </div>`;
            }

            // 5. RENDER — KHUSUS PENDAPATAN pakai widget kartu per kategori
            if (name === "Pendapatan") {
                document.getElementById("app").innerHTML = `
                <div class="page-header">
                    <div><h1>Data Pendapatan</h1><p>Kelola pencatatan pendapatan sekolah per kategori</p></div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        ${extraBtn}
                        ${btnHtml}
                    </div>
                </div>

                <!-- Hero Total Pendapatan -->
                <div class="total-pendapatan-hero">
                    <div>
                        <div class="hero-label">TOTAL SELURUH PENDAPATAN</div>
                        <div class="hero-value">${rupiah(totalPend)}</div>
                        <div style="font-size: 12px; opacity: 0.85; margin-top: 6px;">
                            ${pendValid.length} transaksi • ${getKategoriPendapatanList().length} kategori
                        </div>
                    </div>
                    <div class="hero-icon"><i class="fa-solid fa-sack-dollar"></i></div>
                </div>

                <!-- Widget Per Kategori -->
                <div class="kategori-widgets" id="kategoriWidgets">
                    ${renderKategoriPendapatanWidgets(pendValid, totalPend)}
                </div>

                <!-- Tabel Data -->
                <div class="box">
                    <div class="toolbar" style="align-items: center;">
                        <input class="search" placeholder="Cari transaksi pendapatan..." onkeyup="searchTable(this.value,'${name}')">
                    </div>
                    
                    <div class="table-wrapper">
                        <table>
                            <thead><tr>${columns.map(c=>`<th style="text-transform:capitalize">${c}</th>`).join("")}<th>Aksi</th></tr></thead>
                            <tbody id="tableBody">${renderRows(name, data, columns)}</tbody>
                        </table>
                    </div>
                </div>`;
            } else {
                document.getElementById("app").innerHTML=`
                <div class="page-header">
                    <div><h1>Data ${name}</h1><p>Kelola pencatatan ${name.toLowerCase()} sekolah</p></div>
                    ${btnHtml}
                </div>
                
                <div class="box">
                    <div class="toolbar" style="align-items: center;">
                        <input class="search" placeholder="Cari transaksi" onkeyup="searchTable(this.value,'${name}')">
                        ${summaryHtml}
                    </div>
                    
                    <div class="table-wrapper">
                        <table>
                            <thead><tr>${columns.map(c=>`<th style="text-transform:capitalize">${c}</th>`).join("")}<th>Aksi</th></tr></thead>
                            <tbody id="tableBody">${renderRows(name, data, columns)}</tbody>
                        </table>
                    </div>
                </div>`;
            }
        }

        /* =====================================================
           WIDGET KATEGORI PENDAPATAN
        ===================================================== */
        function getKategoriPendapatanList() {
            let list = db["Kategori Pendapatan"] || [];
            if (list.length === 0) {
                list = [{nama: "Dana BOS"}, {nama: "Sumbangan Pendidikan"}, {nama: "Pendapatan Lain-lain"}];
                db["Kategori Pendapatan"] = list;
                saveDB();
            }
            return list.map(k => typeof k === 'string' ? {nama: k} : k);
        }

        function renderKategoriPendapatanWidgets(pendValid, grandTotal) {
            let kategoris = getKategoriPendapatanList();
            if (kategoris.length === 0) {
                return `<div class="box" style="grid-column: 1 / -1; text-align:center; color: var(--muted); padding: 30px;">
                    Belum ada kategori. Klik "Kelola Kategori" untuk menambahkan.
                </div>`;
            }
            
            let grand = grandTotal || 1;
            
            return kategoris.map(k => {
                let nama = k.nama;
                let items = pendValid.filter(x => x.kategori === nama);
                let totalKat = items.reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
                let persen = Math.round((totalKat / grand) * 100);
                if (persen > 100) persen = 100;
                if (grandTotal === 0) persen = 0;
                
                return `
                <div class="kategori-widget">
                    <div class="kw-header">
                        <div class="kw-title">${nama}</div>
                        <div class="kw-count">${items.length} trx</div>
                    </div>
                    <div class="kw-value">${rupiah(totalKat)}</div>
                    <div class="kw-bar">
                        <div class="kw-bar-inner" style="width: ${persen}%;"></div>
                    </div>
                    <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">
                        ${persen}% dari total pendapatan
                    </div>
                </div>`;
            }).join("");
        }

        /* =====================================================
           MODAL KELOLA KATEGORI
        ===================================================== */
        function openKategoriModal() {
            document.getElementById("newKategoriName").value = "";
            renderKategoriList();
            document.getElementById("modalKategori").classList.add("show");
        }

        function closeKategoriModal() {
            document.getElementById("modalKategori").classList.remove("show");
        }

        function renderKategoriList() {
            let kategoris = getKategoriPendapatanList();
            let pendapatan = db["Pendapatan"] || [];
            let container = document.getElementById("kategoriListContainer");
            
            if (kategoris.length === 0) {
                container.innerHTML = `<div class="kat-empty">
                    <i class="fa-solid fa-inbox" style="font-size: 28px; display: block; margin-bottom: 10px; opacity: 0.4;"></i>
                    Belum ada kategori. Tambahkan kategori baru di atas.
                </div>`;
                return;
            }
            
            container.innerHTML = kategoris.map((k, idx) => {
                let nama = k.nama;
                let count = pendapatan.filter(x => x.kategori === nama).length;
                let totalKat = pendapatan.filter(x => x.kategori === nama).reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
                return `
                <div class="kat-row">
                    <div class="kat-info">
                        <div class="kat-name">${nama}</div>
                        <div class="kat-usage">${count} transaksi • ${rupiah(totalKat)}</div>
                    </div>
                    <div class="kat-actions">
                        <button class="btn btn-light btn-sm" onclick="editKategoriPendapatan(${idx})" title="Ubah nama"><i class="fa-solid fa-pen" style="color: var(--primary2);"></i></button>
                        <button class="btn btn-light btn-sm" style="background:#fff5f5; border:1px solid #ffcccc;" onclick="hapusKategoriPendapatan(${idx})" title="Hapus"><i class="fa-solid fa-trash" style="color: var(--danger);"></i></button>
                    </div>
                </div>`;
            }).join("");
        }

        function tambahKategoriPendapatan() {
            let nama = document.getElementById("newKategoriName").value.trim();
            if (!nama) {
                toast("Masukkan nama kategori!");
                return;
            }
            
            let kategoris = getKategoriPendapatanList();
            if (kategoris.some(k => k.nama.toLowerCase() === nama.toLowerCase())) {
                toast("Kategori dengan nama ini sudah ada!");
                return;
            }
            
            if (!db["Kategori Pendapatan"]) db["Kategori Pendapatan"] = [];
            // Normalize semua jadi {nama: "..."} format
            db["Kategori Pendapatan"] = kategoris.map(k => ({nama: k.nama}));
            db["Kategori Pendapatan"].push({nama: nama});
            
            saveDB();
            document.getElementById("newKategoriName").value = "";
            renderKategoriList();
            toast(`Kategori "${nama}" berhasil ditambahkan`);
        }

        function editKategoriPendapatan(idx) {
            let kategoris = getKategoriPendapatanList();
            let oldNama = kategoris[idx].nama;
            
            Swal.fire({
                title: 'Ubah Nama Kategori',
                input: 'text',
                inputValue: oldNama,
                inputPlaceholder: 'Nama kategori baru...',
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#1d5d9b',
                inputValidator: (val) => {
                    if (!val.trim()) return 'Nama tidak boleh kosong';
                    if (val.trim().toLowerCase() !== oldNama.toLowerCase() && kategoris.some(k => k.nama.toLowerCase() === val.trim().toLowerCase())) {
                        return 'Nama kategori sudah digunakan';
                    }
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    let newNama = res.value.trim();
                    if (newNama === oldNama) return;
                    
                    // Update kategori
                    db["Kategori Pendapatan"] = kategoris.map(k => ({nama: k.nama}));
                    db["Kategori Pendapatan"][idx] = {nama: newNama};
                    
                    // Update semua transaksi yang pakai kategori ini
                    (db["Pendapatan"] || []).forEach(x => {
                        if (x.kategori === oldNama) x.kategori = newNama;
                    });
                    
                    saveDB();
                    renderKategoriList();
                    toast(`Kategori diubah menjadi "${newNama}"`);
                }
            });
        }

        function hapusKategoriPendapatan(idx) {
            let kategoris = getKategoriPendapatanList();
            let nama = kategoris[idx].nama;
            let count = (db["Pendapatan"] || []).filter(x => x.kategori === nama).length;
            
            if (count > 0) {
                Swal.fire({
                    title: 'Tidak Bisa Dihapus',
                    html: `Kategori <b>"${nama}"</b> masih digunakan oleh <b>${count} transaksi</b>.<br><br>Pindahkan atau hapus transaksi tersebut terlebih dahulu.`,
                    icon: 'warning',
                    confirmButtonText: 'Mengerti'
                });
                return;
            }
            
            Swal.fire({
                title: 'Hapus Kategori?',
                html: `Kategori <b>"${nama}"</b> akan dihapus permanen.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonText: 'Batal',
                confirmButtonText: 'Ya, Hapus'
            }).then((res) => {
                if (res.isConfirmed) {
                    db["Kategori Pendapatan"] = kategoris.map(k => ({nama: k.nama}));
                    db["Kategori Pendapatan"].splice(idx, 1);
                    saveDB();
                    renderKategoriList();
                    toast(`Kategori "${nama}" dihapus`);
                }
            });
        }

        function refreshKategoriWidgets() {
            let pendValid = (db["Pendapatan"] || []).filter(x => x.status !== "Ditolak" && x.status !== "Menunggu");
            let totalPend = total(pendValid);
            let container = document.getElementById("kategoriWidgets");
            if (container) {
                container.innerHTML = renderKategoriPendapatanWidgets(pendValid, totalPend);
            }
        }

        function renderRows(name, data, columns){
            if(data.length === 0) return `<tr><td colspan="${columns.length+1}" style="text-align:center">Belum ada data transaksi</td></tr>`;
            
            return data.map(row => `
                <tr>
                    ${columns.map(c => {
                        let value = row[c];
                        if (c === "status") value = badge(value); 
                        else if (c === "jumlah") value = rupiah(value);
                        else if (c === "tanggal") value = formatDate(value);
                        return `<td>${value ?? "-"}</td>`;
                    }).join("")}
                    <td>
                        <button class="btn btn-light btn-sm" onclick="openForm('${name}',${row.id})" title="Edit Data"><i class="fa-solid fa-pen" style="color: #1d5d9b;"></i></button>
                        <button class="btn btn-light btn-sm" onclick="deleteData('${name}',${row.id})" title="Hapus Data" style="background-color: #fff5f5; border: 1px solid #ffcccc;"><i class="fa-solid fa-trash" style="color: #dc3545;"></i></button>
                    </td>
                </tr>
            `).join("");
        }

        function searchTable(keyword, name){
            const data = db[name] || [];
            const filtered = data.filter(row => Object.values(row).join(" ").toLowerCase().includes(keyword.toLowerCase()));
            const columns = getDefaultFields(name);
            document.getElementById("tableBody").innerHTML = renderRows(name, filtered, columns);
        }

        /* =====================================================
           FORMATTING ANGKA & BANK MANUAL
        ===================================================== */
        function formatRupiahInput(elem) {
            let number_string = elem.value.replace(/[^,\d]/g, '').toString();
            let split = number_string.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            elem.value = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        }

        function checkManualBank(selectElem, fieldName) {
            const manualInput = document.getElementById(`manual_${fieldName}`);
            if(selectElem.value === "Lainnya") {
                manualInput.style.display = "block";
                manualInput.required = true;
            } else {
                manualInput.style.display = "none";
                manualInput.required = false;
            }
        }

        /* =====================================================
           FORM DINAMIS & DROPDOWN OTOMATIS
        ===================================================== */
        function openForm(name, id=null){
            let item = id ? db[name].find(x => x.id === id) : null;
            document.getElementById("modal").classList.add("show");
            document.getElementById("modalTitle").innerText = id ? `Edit ${name}` : `Tambah ${name}`;
            
            let fields = getDefaultFields(name);

            document.getElementById("dataForm").innerHTML=`
                <div class="form-grid">
                ${fields.map(field=>{
                    let value = item?.[field]??""; let inputHtml = ""; let isFull = false;

                    if (field === "keterangan") { 
                        isFull = true; inputHtml = `<textarea name="${field}" placeholder="Tuliskan keterangan detail transaksi" required>${value}</textarea>`; 
                    } 
                    else if (field === "status") { 
                        inputHtml = `
                        <select name="${field}" required>
                            <option value="Tunai" ${value === "Tunai" ? "selected" : ""}>Tunai</option>
                            <option value="Transfer" ${value === "Transfer" ? "selected" : ""}>Transfer</option>
                        </select>`; 
                    } 
                    else if (field === "tanggal") { 
                        inputHtml = `<input type="date" name="${field}" value="${value}" required>`; 
                    } 
                    else if (field === "jumlah") { 
                        let formattedValue = value ? Number(value).toLocaleString('id-ID') : "";
                        inputHtml = `<input type="text" name="${field}" value="${formattedValue}" oninput="formatRupiahInput(this)" placeholder="Ketik nominal" required>`; 
                    }
                     else if (field === "kategori" && name === "Pendapatan") { 
                        let kats = getKategoriPendapatanList();
                        let opts = `<option value="">-- Pilih Kategori --</option>` + 
                            kats.map(k => `<option value="${k.nama}" ${value === k.nama ? "selected" : ""}>${k.nama}</option>`).join("");
                        inputHtml = `<select name="${field}" required>${opts}</select>`; 
                    }
                    // PERUBAHAN: Kategori Pengeluaran Baru Sesuai Request
                    else if (field === "kategori" && name === "Pengeluaran") { 
                        let kats = ["Belanja Pegawai", "Belanja Barjas", "Belanja Modal", "Belanja Lainnya"];
                        let opts = kats.map(k => `<option value="${k}" ${value === k ? "selected" : ""}>${k}</option>`).join("");
                        inputHtml = `<select name="${field}" required><option value="">-- Pilih Kategori --</option>${opts}</select>`; 
                    }
                    else if (field === "dari" || field === "ke") { 
                        let dbBanks = (db["Rekening/Kas"] || []).map(r => r.nama);
                        let defaultBanks = ["Kas Tunai Sekolah", "Bank BRI", "Bank BNI", "Bank BCA", "Bank Mandiri", "Bank BJB"];
                        let allBanks = [...new Set([...dbBanks, ...defaultBanks])]; 
                        
                        let isManual = value && !allBanks.includes(value);

                        let opts = allBanks.map(b => `<option value="${b}" ${value === b ? "selected" : ""}>${b}</option>`).join("");
                        opts += `<option value="Lainnya" ${isManual ? "selected" : ""}>Bank Lainnya (Ketik Manual)...</option>`;
                        
                        let manualInput = `<input type="text" id="manual_${field}" name="manual_${field}" placeholder="Ketik nama bank / sumber dana..." value="${isManual ? value : ''}" style="margin-top: 5px; display: ${isManual ? 'block' : 'none'};">`;

                        inputHtml = `<select name="${field}" onchange="checkManualBank(this, '${field}')" required>${opts}</select>${manualInput}`; 
                    }
                    else { inputHtml = `<input type="text" name="${field}" value="${value}" required>`; }

                    return `<div class="form-group ${isFull ? "full" : ""}"><label style="text-transform:capitalize">${field}</label>${inputHtml}</div>`;
                }).join("")}
                </div><br>
                <button type="button" class="btn btn-success" onclick="saveForm('${name}', ${id || "null"})"><i class="fa-solid fa-save"></i> Simpan</button>
                <button type="button" class="btn btn-light" onclick="closeModal()">Batal</button>
            `;
        }

        function getDefaultFields(name){
            const map = { 
                "Pendapatan": ["tanggal", "kategori", "keterangan", "jumlah", "status"], 
                "Pengeluaran": ["tanggal", "kategori", "keterangan", "jumlah", "status"], 
                "Transfer Kas/Rekening": ["tanggal", "dari", "ke", "keterangan", "jumlah", "status"] 
            };
            return map[name] || ["keterangan"];
        }

        /* =====================================================
           SIMPAN & HAPUS
        ===================================================== */
        function saveForm(name, id){
            const form = document.getElementById("dataForm");
            if(!form.checkValidity()) { toast("Mohon lengkapi semua kolom transaksi!"); return; }

            const fd = new FormData(form); 
            let obj = {};
            
            fd.forEach((value, key) => { 
                if (key.startsWith("manual_")) return; 

                if (key === "jumlah") { 
                    obj[key] = Number(value.replace(/\./g, '')); 
                } 
                else if ((key === "dari" || key === "ke") && value === "Lainnya") {
                    obj[key] = fd.get(`manual_${key}`);
                } 
                else {
                    obj[key] = value;
                }
            });

            if(id){ const index = db[name].findIndex(x => x.id === id); obj.id = id; db[name][index] = obj; toast("Transaksi berhasil diperbarui"); }
            else{ obj.id = Date.now(); if(!db[name]) db[name] = []; db[name].push(obj); toast("Transaksi berhasil ditambahkan"); }
            
            saveDB(); closeModal(); openTable(name);
        }

        function deleteData(name, id){
            Swal.fire({
                title: 'Hapus Transaksi',
                text: "Anda yakin ingin membatalkan dan menghapus transaksi ini",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="fa-solid fa-trash"></i> Ya',
                cancelButtonText: 'Batal',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    db[name] = db[name].filter(x => x.id !== id);
                    saveDB(); 
                    openTable(name); 
                    Swal.fire({ title: 'Terhapus', text: 'Transaksi berhasil dihapus', icon: 'success', timer: 1500, showConfirmButton: false });
                }
            });
        }

        // BACA REQUEST DARI SIDEBAR DAN BUKA MENU YANG SESUAI
        const target = sessionStorage.getItem("targetMenu");
        if(target === "Pengeluaran" || target === "Transfer Kas/Rekening") {
            openTable(target);
            document.getElementById('transactionMenu').classList.add('open');
        } else {
            openTable("Pendapatan");
            document.getElementById('transactionMenu').classList.add('open');
        }
        sessionStorage.removeItem("targetMenu"); 
    </script>
</body>
</html>
